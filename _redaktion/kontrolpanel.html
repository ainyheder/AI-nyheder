<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AI-nyheder · Kontrolpanel</title>
<!-- Relativ sti med vilje: panelet åbnes fra file://, hvor "/assets/..." peger
     på filsystemets rod og skrifterne derfor slet ikke bliver hentet. -->
<link rel="stylesheet" href="../assets/fonts/skrifter.css">
<style>
:root {
  --bg:#f4f2ec; --kort:#fff; --blaek:#191714; --svag:#6d675d; --linje:#e2ddd2;
  --accent:#5b4bf0; --accent-svag:#ecebfd; --groen:#2e9e5b; --rav:#c2711d;
  --skygge:0 2px 4px rgba(25,23,20,.05), 0 12px 32px rgba(25,23,20,.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Inter",-apple-system,sans-serif; background:var(--bg); color:var(--blaek); line-height:1.6; }
.topbar { position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--linje); padding:14px 28px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:22px; letter-spacing:-.03em; }
.brand em { font-style:normal; color:var(--accent); }
.stempel { font-size:12px; color:var(--svag); margin-left:auto; }
.app { display:flex; align-items:stretch; min-height:calc(100vh - 57px); }
.side { width:262px; flex:none; border-right:1px solid var(--linje);
  padding:18px 12px 90px; position:sticky; top:57px; align-self:flex-start;
  max-height:calc(100vh - 57px); overflow-y:auto; }
.side-gruppe { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--svag); padding:14px 12px 7px; }
.side-punkt { display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  font:inherit; font-size:13.5px; background:none; border:0; border-radius:9px;
  padding:8px 11px; cursor:pointer; color:var(--blaek); line-height:1.35; }
.side-punkt:hover { background:color-mix(in srgb, var(--blaek) 5%, transparent); }
.side-punkt.valgt { background:var(--accent-svag); color:var(--accent); font-weight:600; }
.side-punkt .nr { width:20px; height:20px; border-radius:50%; flex:none;
  background:color-mix(in srgb, var(--blaek) 8%, transparent); color:var(--svag);
  font-size:10.5px; font-weight:700; display:grid; place-items:center; }
.side-punkt.valgt .nr { background:var(--accent); color:#fff; }
.side-punkt .prik { width:7px; height:7px; border-radius:50%; background:var(--groen); flex:none; margin-left:auto; }
.ind { flex:1; min-width:0; padding:26px 34px 96px; }
h1 { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:30px; letter-spacing:-.02em; margin-bottom:6px; }
.manchet { font-size:15px; color:var(--svag); margin-bottom:22px; max-width:80ch; }
h2 { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:20px; margin:0 0 12px; }
@media (max-width:900px) {
  .app { display:block; }
  .side { width:auto; position:static; max-height:none; border-right:0;
    border-bottom:1px solid var(--linje); display:flex; flex-wrap:wrap; gap:4px; padding:10px; }
  .side-gruppe { width:100%; padding:6px 8px 2px; }
  .side-punkt { width:auto; }
  .ind { padding:20px 16px 96px; }
}
.advarsel { background:#fdf3e3; border-left:3px solid var(--rav); border-radius:0 10px 10px 0;
  padding:13px 17px; font-size:14px; margin-bottom:24px; }
.flow { background:var(--kort); border:1px solid var(--linje); border-radius:16px; padding:20px; box-shadow:var(--skygge); }
.flow svg { width:100%; height:auto; display:block; }
.etape { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:16px 18px 18px; box-shadow:var(--skygge); margin-bottom:10px; }
.etape-top { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.etape-nr { width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
  font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:12.5px;
  display:grid; place-items:center; flex:none; }
.etape-navn { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:17px; }
.etape-hvornaar { font-size:12px; color:var(--svag); margin-left:auto; }
.net { display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px; }
.pil { text-align:center; color:#b4b2a9; font-size:17px; line-height:1; margin:2px 0 10px; }
.ikke { background:color-mix(in srgb, var(--blaek) 4%, transparent);
  border:1px dashed var(--linje); border-radius:12px; padding:13px 16px; }
.ikke .n { font-weight:700; font-size:14px; }
.ikke .b { font-size:12.5px; color:var(--svag); margin-top:2px; }
.dok { background:#fdf9ef; border:1px solid #e8dcc0; border-left:4px solid var(--rav);
  border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; font:inherit;
  transition:transform .12s, border-color .12s; }
.dok:hover { transform:translateY(-2px); border-color:var(--rav); }
.dok.laes { cursor:pointer; background:color-mix(in srgb, var(--blaek) 3%, transparent);
  border:1px dashed var(--linje); border-left:1px dashed var(--linje); }
.dok .n { font-weight:700; font-size:14.5px; }
.dok .b { font-size:12.5px; color:var(--svag); margin:3px 0 8px; }
.dok .f { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--rav);
  background:#f6ecd8; border-radius:5px; padding:2px 7px; display:inline-block; }
.dok.laes .f { color:var(--svag); background:color-mix(in srgb, var(--blaek) 6%, transparent); }
.dok .flag { font-size:10.5px; font-weight:700; color:var(--groen); margin-left:6px; }
/* Køen som læsbar liste */
.kliste { margin:4px 0 0; }
.kgruppe { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--svag); margin:20px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linje); }
.kgruppe:first-child { margin-top:4px; }
.kpunkt { display:flex; gap:12px; align-items:flex-start; background:var(--kort);
  border:1px solid var(--linje); border-radius:11px; padding:11px 13px; margin-bottom:7px; }
.kpunkt.top { border-color:var(--accent); border-left:4px solid var(--accent); }
.knr { width:22px; height:22px; border-radius:50%; flex:none; margin-top:1px;
  background:color-mix(in srgb, var(--blaek) 7%, transparent); color:var(--svag);
  font-size:11px; font-weight:700; display:grid; place-items:center; }
.kpunkt.top .knr { background:var(--accent); color:#fff; }
.ktekst { flex:1; min-width:0; }
.ktitel { font-size:14px; font-weight:600; line-height:1.4; }
.kdetalje { font-size:12.5px; color:var(--svag); line-height:1.5; margin-top:3px; }
.kknapper { display:flex; gap:3px; flex:none; }
.kknapper button { width:27px; height:27px; border-radius:7px; border:1px solid var(--linje);
  background:var(--bg); cursor:pointer; font-size:12px; color:var(--svag); line-height:1; padding:0; }
.kknapper button:hover { border-color:var(--accent); color:var(--accent); }
.kknapper button.ok:hover { border-color:var(--groen); color:var(--groen); }
.ktom { color:var(--svag); font-size:14px; padding:20px 0; }
.hj { background:var(--kort); border:1px solid var(--linje); border-left:4px solid var(--linje);
  border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; font:inherit;
  transition:transform .12s, border-color .12s; }
.hj:hover { transform:translateY(-2px); border-color:var(--accent); }
.hj.aendret { border-left-color:var(--accent); }
.hj .n { font-weight:700; font-size:14.5px; }
.hj .b { font-size:12.5px; color:var(--svag); margin:3px 0 8px; }
.hj .m { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--accent);
  background:var(--accent-svag); border-radius:5px; padding:2px 7px; display:inline-block; }
.hj .flag { font-size:10.5px; font-weight:700; color:var(--groen); margin-left:6px; }
/* Læsertal. Én måleenhed (besøg), så én farve - accenten. Tallene står i
   tekstfarver, aldrig i accentfarven: en lys farve er ulæselig som tekst. */
.kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:12px; }
.kpi-kort { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:15px 18px 16px; box-shadow:var(--skygge); }
.kpi-tal { font-size:33px; font-weight:600; letter-spacing:-.022em; line-height:1.12; }
.kpi-mrk { font-size:12.5px; color:var(--svag); margin-top:3px; }
.lgruppe { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:18px; margin:28px 0 4px; }
.lmanchet { font-size:13px; color:var(--svag); margin-bottom:11px; max-width:74ch; }
.bjaelker { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:4px 18px 6px; box-shadow:var(--skygge); }
.bj { display:grid; grid-template-columns:minmax(0,1fr) 62px; gap:14px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--linje); }
.bj:last-child { border-bottom:0; }
.bj-navn { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 8px tynd bjælke, firkantet ved nulpunktet og rundet i den ende, der bærer
   værdien - så øjet kan se, hvor tallet slutter. */
.bj-spor { height:8px; margin-top:6px; border-radius:0 4px 4px 0;
  background:color-mix(in srgb, var(--accent) 13%, transparent); }
.bj-fyld { height:100%; border-radius:0 4px 4px 0; background:var(--accent); }
.bj-tal { font-size:13px; text-align:right; color:var(--svag); font-variant-numeric:tabular-nums; }
.nul { background:#fdf9ef; border:1px solid #e8dcc0; border-left:4px solid var(--rav);
  border-radius:12px; padding:14px 17px; }
.nul-liste { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.nul-liste code { font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--rav);
  background:#f6ecd8; border-radius:6px; padding:3px 9px; }
.lgodt { background:var(--kort); border:1px solid var(--linje); border-left:4px solid var(--groen);
  border-radius:12px; padding:14px 17px; font-size:14px; }
/* Grafer. Tegnet i hånden som SVG - panelet åbnes fra file:// og må ikke
   afhænge af et bibliotek, der skal hentes. */
.graf { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:15px 18px 11px; box-shadow:var(--skygge); }
.graf svg { width:100%; height:auto; display:block; overflow:visible; }
.gnet { stroke:#e1e0d9; stroke-width:1; }
.gakse { fill:#898781; font-size:10.5px; font-family:"Inter",sans-serif; }
.gvaerdi { fill:var(--blaek); font-size:11px; font-weight:600; font-family:"Inter",sans-serif; }
/* Tegnforklaring. Ved to eller flere serier er den obligatorisk - farve alene
   må aldrig være det eneste, der adskiller dem. */
.tegnf { display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:11px;
  font-size:12.5px; color:var(--svag); }
.tegnf span { display:inline-flex; align-items:center; gap:6px; }
.tegnf i { width:10px; height:10px; border-radius:3px; flex:none; }
.tegnf b { color:var(--blaek); font-weight:600; font-variant-numeric:tabular-nums; }
/* Artikelliste med tema-prik. Hele rækken er en knap - klik åbner detaljerne. */
.art { display:grid; grid-template-columns:22px minmax(0,1fr) 68px; gap:11px;
  align-items:baseline; padding:11px 0; border-bottom:1px solid var(--linje);
  width:100%; text-align:left; font:inherit; background:none; border-left:0;
  border-right:0; border-top:0; cursor:pointer; }
.art:last-child { border-bottom:0; }
.art:hover { background:color-mix(in srgb, var(--accent) 5%, transparent); }
.art:hover .art-rub { color:var(--accent); }
.art-pil { font-size:11px; color:var(--svag); margin-left:6px; }
.art-nr { font-size:11px; font-weight:700; color:var(--svag); text-align:right;
  font-variant-numeric:tabular-nums; }
.art-rub { font-size:14px; line-height:1.4; }
.art-meta { font-size:11.5px; color:var(--svag); margin-top:3px; }
.art-meta i { width:8px; height:8px; border-radius:50%; display:inline-block;
  margin-right:5px; vertical-align:baseline; }
.art-tal { text-align:right; font-size:13px; font-variant-numeric:tabular-nums; }
.art-tal b { display:block; font-size:15px; font-weight:600; color:var(--blaek); }
.art-tal span { font-size:11px; color:var(--svag); }
.bag { display:none; position:fixed; inset:0; z-index:200; background:rgba(25,23,20,.55);
  backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px; }
.bag.aaben { display:flex; }
.modal { background:var(--bg); border-radius:18px; max-width:820px; width:100%; max-height:90vh;
  overflow-y:auto; padding:26px 30px; position:relative; box-shadow:0 24px 80px rgba(25,23,20,.35); }
.luk { position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--linje); background:var(--kort); cursor:pointer; font-size:15px; font-weight:700; color:var(--svag); }
.modal h3 { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:24px; margin-bottom:4px; }
.modal .b { font-size:14px; color:var(--svag); margin-bottom:18px; }
label { display:block; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--svag); margin:16px 0 6px; }
select, textarea { width:100%; font-family:inherit; font-size:14px; padding:10px 13px;
  border:1px solid var(--linje); border-radius:10px; background:var(--kort); color:var(--blaek); }
textarea { font-family:"JetBrains Mono",monospace; font-size:12.5px; line-height:1.6; min-height:300px; resize:vertical; }
select:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
.raekke { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center; }
/* a.k er med, fordi "Åbn artiklen" er et rigtigt link og ikke en knap - den
   skal kunne åbnes i ny fane, men se ud som resten. */
button.k, a.k { font:inherit; font-size:14px; font-weight:700; border-radius:999px; padding:11px 22px; cursor:pointer; border:1px solid var(--linje); background:var(--kort); color:var(--blaek); display:inline-block; text-decoration:none; }
button.k:hover, a.k:hover { border-color:var(--accent); color:var(--accent); }
button.k.fyldt { background:var(--accent); color:#fff; border-color:var(--accent); }
button.k.fyldt:hover { opacity:.9; color:#fff; }
.bund { position:fixed; left:0; right:0; bottom:0; background:var(--kort); border-top:1px solid var(--linje);
  padding:14px 28px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; box-shadow:0 -4px 20px rgba(25,23,20,.06); }
.bund .tekst { font-size:13.5px; color:var(--svag); margin-right:auto; }
.tom { background:var(--kort); border:1px dashed var(--linje); border-radius:14px; padding:34px; text-align:center; color:var(--svag); font-size:15px; }

/* ---- Læsevisning af nat-loggen og gennemgangen -------------------------- */
/* Loggen er lang. På en bred skærm er der plads til to spalter, og så halveres
   scrollen - hvert kort er selvstændigt, så man læser stadig ét ad gangen. */
.modal.bred { max-width:min(1560px, 96vw); max-height:94vh; padding:24px 28px; }
.laesevis { font-size:15px; line-height:1.7; }
.laesevis .intro { color:var(--svag); font-size:14px; margin-bottom:18px; }
@media (min-width:1120px) {
  .modal.bred .laesevis { column-count:2; column-gap:18px; }
  .modal.bred .laesevis .intro { column-span:all; }
  .modal.bred .lslut { column-span:all; }
}
@media (min-width:1900px) {
  .modal.bred .laesevis { column-count:3; }
}

/* Én nat = ét kort */
.lkort { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:22px 26px; margin-bottom:14px; box-shadow:var(--skygge);
  break-inside:avoid; -webkit-column-break-inside:avoid; }
.lkort.regnskab { background:var(--accent-svag); border-color:#cfcafb; }
.lkort > .dato { font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.lkort.regnskab > .dato { color:#4438c9; }
.lkort > .titel { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:20px;
  line-height:1.22; letter-spacing:-.01em; margin-bottom:14px; }
.lkort > .titel:only-child, .lkort > .dato + .titel:last-child { margin-bottom:0; }

/* Fandt / Gjorde / Testede / Til Torben */
.lfelt { display:grid; grid-template-columns:96px 1fr; gap:14px; align-items:start;
  padding:12px 0; border-top:1px solid var(--linje); }
.lkort.regnskab .lfelt { border-top-color:#d9d4f7; }
.lfelt:first-of-type { border-top:0; padding-top:2px; }
.lfelt > .navn { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--svag); padding-top:4px; }
.lfelt.torben > .navn { color:var(--rav); }
.lfelt.torben { background:#fdf9ef; border-radius:10px; padding:14px 16px; margin:10px -16px 0;
  border-top:0; border-left:3px solid var(--rav); }

.laesevis p { margin:0 0 11px; }
.laesevis p:last-child { margin-bottom:0; }
.laesevis h4 { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:16px;
  margin:18px 0 8px; }
.laesevis ul, .laesevis ol { margin:0 0 12px; padding-left:22px; }
.laesevis li { margin-bottom:5px; }
.laesevis li::marker { color:var(--accent); }
.laesevis strong { font-weight:700; background:linear-gradient(transparent 62%, var(--accent-svag) 62%); }
.lkort.regnskab .laesevis strong, .lkort.regnskab strong { background:linear-gradient(transparent 62%, #dcd7fb 62%); }
.laesevis em { font-style:italic; color:var(--svag); }
.laesevis code { font-family:"JetBrains Mono",monospace; font-size:12.5px;
  background:color-mix(in srgb, var(--blaek) 6%, transparent); border-radius:5px; padding:1.5px 6px; }
.laesevis pre { background:#1d1b18; color:#e8e4dc; border-radius:12px; padding:15px 18px;
  overflow-x:auto; margin:0 0 13px; }
.laesevis pre code { background:none; padding:0; color:inherit; font-size:12.5px; line-height:1.6; }
.laesevis blockquote { background:#fdf9ef; border-left:3px solid var(--rav);
  border-radius:0 12px 12px 0; padding:14px 18px; margin:0 0 14px; font-size:14.5px; }
.laesevis blockquote p:last-child { margin-bottom:0; }
.laesevis blockquote ol, .laesevis blockquote ul { margin-bottom:0; }
.laesevis hr { border:0; border-top:1px solid var(--linje); margin:16px 0; }
.laesevis table { border-collapse:collapse; width:100%; font-size:13.5px; margin:0 0 14px; }
.laesevis th, .laesevis td { border:1px solid var(--linje); padding:7px 11px; text-align:left; vertical-align:top; }
.laesevis th { background:color-mix(in srgb, var(--blaek) 4%, transparent); font-weight:700; }
.laesevis a { color:var(--accent); }
.lslut { text-align:center; color:var(--svag); font-size:13px; padding:16px 0 4px; }
@media (max-width:560px) {
  .lfelt { grid-template-columns:1fr; gap:2px; }
  .lkort { padding:18px; }
}
code { font-family:"JetBrains Mono",monospace; font-size:12.5px; background:var(--accent-svag); padding:2px 6px; border-radius:5px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">AI<em>-nyheder</em> · kontrolpanel</span>
  <span class="stempel" id="stempel"></span>
</div>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="ind">
    <div class="advarsel" id="advarsel" hidden></div>
    <div id="rude"></div>
    <div class="tom" id="tomboks" hidden></div>
  </main>
</div>

<div class="bund">
  <span class="tekst" id="bundtekst">Ingen ændringer endnu</span>
  <button class="k" id="nulstilAlt">Nulstil alle</button>
  <button class="k" id="kopier">Kopiér JSON</button>
  <button class="k" id="hent">Hent fil</button>
  <button class="k fyldt" id="gem">Gem i mappen</button>
</div>

<div class="bag" id="bag"><div class="modal" id="modal"></div></div>

<script src="../data/hjerne-data.js" onerror="window.HJERNE_MANGLER=true"></script>
<!-- Læsertallene. Filen findes først, når CLOUDFLARE_API_TOKEN er sat som
     GitHub-secret; indtil da siger Læserne-ruden selv, hvad der mangler. -->
<script src="../data/laesertal-data.js" onerror="window.LAESERTAL_MANGLER=true"></script>
<script>
(function () {
  var S = window.HJERNE_STATUS;
  var adv = document.getElementById("advarsel");

  if (!S) {
    document.getElementById("tomboks").hidden = false;
    document.getElementById("tomboks").innerHTML =
      "Kunne ikke finde <code>hjerne-data.js</code>.<br><br>" +
      "Filen skrives af crawleren. Kør et crawl (eller <code>python3 crawler.py</code>) én gang, " +
      "og genindlæs så denne side.";
    
    return;
  }

  document.getElementById("stempel").textContent =
    "Målt " + new Date(S.opdateret).toLocaleString("da-DK") +
    " · daglig model: " + S.daglig_model;

  if (!S.gemini_tilgaengelig) {
    adv.hidden = false;
    adv.innerHTML = "<strong>Ingen Google-nøgle sat.</strong> Vælger du en Gemini-model " +
      "til et trin, bliver den ignoreret, og trinnet kører videre på den daglige model.";
  }

  var MODELLER = [
    ["", "Brug den daglige model (" + S.daglig_model + ")"],
    ["gemini-3.6-flash", "Gemini 3.6 Flash — klogest, dyrest"],
    ["gemini-3.5-flash", "Gemini 3.5 Flash — midt imellem"],
    ["gemini-3.5-flash-lite", "Gemini 3.5 Flash Lite — billigst, hurtigst"],
    ["gemini-3.1-flash-lite", "Gemini 3.1 Flash Lite — forrige generation"]
  ];

  // Ændringer i denne session. navn -> {model?, prompt?}
  var aendret = {};
  Object.keys(S.hjerner).forEach(function (n) {
    var h = S.hjerner[n], e = {};
    if (h.egen_model) e.model = h.model;
    if (h.egen_prompt) e.prompt = h.aktiv_prompt;
    if (e.model || e.prompt) aendret[n] = e;
  });

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

  function aktivModel(n) {
    if (aendret[n] && aendret[n].model) return aendret[n].model;
    return n === "gennemgang" ? S.kritik_model : S.daglig_model;
  }
  function aktivPrompt(n) {
    if (aendret[n] && aendret[n].prompt) return aendret[n].prompt;
    return S.hjerner[n].standard_prompt;
  }
  function erAendret(n) {
    var e = aendret[n]; if (!e) return false;
    if (e.model) return true;
    return !!(e.prompt && e.prompt.trim() !== (S.hjerner[n].standard_prompt || "").trim());
  }

  // Rækkefølgen crawleren faktisk arbejder i.
  var ETAPER = [
    { navn: "Hent nyhederne", hvornaar: "hver kørsel",
      ikke: [["RSS-kilderne", "opsaetning/feeds.json — 11 kilder, ingen AI"]] },
    { navn: "Skriv historien på dansk", hvornaar: "kun nye artikler",
      trin: ["omskriv", "kategori", "dublet", "brief", "redaktoer"] },
    { navn: "Hold arkivet i orden", hvornaar: "lidt ad gangen hver kørsel",
      trin: ["navngiv", "stram"] },
    { navn: "Lav billederne", hvornaar: "kun dagens top-5",
      trin: ["motiv"],
      ikke: [["Billedmodellen", "Tegner selve billedet — vælges ikke her"]] },
    { navn: "Byg siderne", hvornaar: "hver kørsel",
      ikke: [["Artikelsider, RSS og sitemap", "Ren filskrivning, ingen AI"]] },
    { navn: "De faste indslag", hvornaar: "én gang om dagen eller ugen",
      trin: ["dagens_overblik", "kartotek", "quiz", "ugens_overblik"] },
    { navn: "YouTube", hvornaar: "op til 14 videoer pr. kørsel",
      trin: ["youtube"] },
    { navn: "Ud i verden", hvornaar: "max 2 opslag om dagen",
      trin: ["opslag"] },
    { navn: "Se på det hele bagefter", hvornaar: "én gang i døgnet",
      ikke: [["Læsertal fra Cloudflare", "Hentes ind, så gennemgangen kan se hvad folk læser"]],
      trin: ["gennemgang"] }
  ];

  function trinHtml(n) {
    var h = S.hjerner[n], a = erAendret(n);
    return '<button class="hj' + (a ? " aendret" : "") + '" data-n="' + n + '">' +
      '<div class="n">' + esc(n.replace(/_/g, " ")) + (a ? '<span class="flag">ÆNDRET</span>' : "") + "</div>" +
      '<div class="b">' + esc(h.beskrivelse) + "</div>" +
      '<span class="m">' + esc(aktivModel(n)) + "</span></button>";
  }

  // ---- Læserne -------------------------------------------------------------
  // window.LAESERTAL skrives af crawleren (hent_laesertal i crawler.py).
  // Mangler den, er Cloudflare-tokenet ikke sat - og så siger ruden det selv.
  var L = window.LAESERTAL;
  // To forskellige tilstande, som ikke må forveksles: ingen fil betyder, at
  // tokenet mangler. En fil uden sider betyder, at målingen kører fint - men
  // at Cloudflare ikke har registreret ét eneste besøg. Det er to helt
  // forskellige problemer, og de skal have hver sin besked.
  var harFil = !!L;
  var harTal = !!(L && L.sider && L.sider.length);

  function ltal(n) { return (n == null ? 0 : n).toLocaleString("da-DK"); }

  function kpiKort(vaerdi, maerkat) {
    return '<div class="kpi-kort"><div class="kpi-tal">' + esc(vaerdi) + "</div>" +
      '<div class="kpi-mrk">' + esc(maerkat) + "</div></div>";
  }

  // Én måleenhed pr. liste, så bjælkerne må gerne dele farve. Bredden er
  // relativ til den største i listen - ikke til det samlede antal besøg.
  // r.farve er valgfri. Er den sat, følger farven ENTITETEN - så en kategori
  // har samme farve her som i temagrafen. Uden den bruges accenten, fordi
  // listen så kun måler én ting og ikke skal farvekodes overhovedet.
  function bjaelker(raekker) {
    var storst = raekker.reduce(function (m, r) { return Math.max(m, r.vaerdi); }, 0);
    return '<div class="bjaelker">' + raekker.map(function (r) {
      // Gulv på 2%, så en række med ét enkelt besøg stadig er synlig.
      var pct = storst > 0 ? Math.max(2, r.vaerdi / storst * 100) : 0;
      var f = r.farve
        ? ' style="width:' + pct.toFixed(1) + '%;background:' + r.farve + '"'
        : ' style="width:' + pct.toFixed(1) + '%"';
      var spor = r.farve
        ? ' style="background:color-mix(in srgb, ' + r.farve + ' 13%, transparent)"' : "";
      return '<div class="bj"><div><div class="bj-navn" title="' + esc(r.navn) + '">' +
        esc(r.navn) + '</div><div class="bj-spor"' + spor + '><div class="bj-fyld"' +
        f + "></div></div></div>" +
        '<div class="bj-tal">' + ltal(r.vaerdi) + "</div></div>";
    }).join("") + "</div>";
  }

  // Farver til flere serier. Valideret palet (kørt mod hvid flade): alle
  // nabopar klarer både farveblindheds- og normalsynsgulvet. RÆKKEFØLGEN er
  // selve sikkerheden - byt ikke om på den uden at validere igen. Tre af dem
  // har under 3:1 kontrast mod hvid, derfor står der altid en skreven
  // tegnforklaring med tal ved siden af; farven er aldrig eneste kendetegn.
  var SERIEFARVER = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"];

  // Runde akse-tal i stedet for 27. Trinene er tætte med vilje: med kun
  // 1/2/2,5/5 blev et maksimum på 27 til en akse på 50, og så lå søjlerne
  // mast ned i nederste femtedel af grafen.
  function pentLoft(m) {
    var p = Math.pow(10, Math.floor(Math.log(Math.max(m, 1)) / Math.LN10));
    var trin = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < trin.length; i++) if (p * trin[i] >= m) return p * trin[i];
    return p * 10;
  }

  function dagMrk(iso) {
    return new Date(iso + "T12:00:00").toLocaleDateString("da-DK",
      { day: "numeric", month: "short" });
  }

  function nul(v) { return (v == null ? 0 : v); }

  // ---- Kurve: besøg og sidevisninger pr. dag -------------------------------
  function dagskurve(serie) {
    var W = 960, H = 186, mV = 48, mH = 14, mT = 10, mB = 22, n = serie.length;
    var raa = 1;
    serie.forEach(function (d) { raa = Math.max(raa, nul(d.visninger), nul(d.besoeg)); });
    var top = pentLoft(raa);
    function bx(i) { return mV + (W - mV - mH) * (n === 1 ? 0.5 : i / (n - 1)); }
    function by(v) { return mT + (H - mT - mB) * (1 - nul(v) / top); }

    var net = "";
    [0, 0.5, 1].forEach(function (f) {
      var y = by(top * f);
      net += '<line class="gnet" x1="' + mV + '" y1="' + y.toFixed(1) + '" x2="' +
        (W - mH) + '" y2="' + y.toFixed(1) + '"/><text class="gakse" x="' + (mV - 9) +
        '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        ltal(Math.round(top * f)) + "</text>";
    });
    function linje(felt) {
      return serie.map(function (d, i) {
        return (i ? "L" : "M") + bx(i).toFixed(1) + " " + by(d[felt]).toFixed(1);
      }).join(" ");
    }
    var vask = "M" + bx(0).toFixed(1) + " " + by(0).toFixed(1) + " " +
      serie.map(function (d, i) {
        return "L" + bx(i).toFixed(1) + " " + by(d.visninger).toFixed(1);
      }).join(" ") + " L" + bx(n - 1).toFixed(1) + " " + by(0).toFixed(1) + " Z";

    var mrk = "";
    [0, Math.floor(n / 2), n - 1].forEach(function (i) {
      mrk += '<text class="gakse" x="' + bx(i).toFixed(1) + '" y="' + (H - 5) +
        '" text-anchor="' + (i === 0 ? "start" : (i === n - 1 ? "end" : "middle")) +
        '">' + dagMrk(serie[i].dato) + "</text>";
    });
    var sidst = serie[n - 1];
    // Prikkerne har en 2px hvid ring, så de kan ses, hvor kurverne krydser
    function prik(felt, farve) {
      return '<circle cx="' + bx(n - 1).toFixed(1) + '" cy="' + by(sidst[felt]).toFixed(1) +
        '" r="4" fill="' + farve + '" stroke="#fff" stroke-width="2"/>';
    }
    return '<div class="graf"><svg viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Besøg og sidevisninger pr. dag">' + net +
      '<path d="' + vask + '" fill="' + SERIEFARVER[1] + '" fill-opacity="0.10"/>' +
      '<path d="' + linje("visninger") + '" fill="none" stroke="' + SERIEFARVER[1] +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + linje("besoeg") + '" fill="none" stroke="' + SERIEFARVER[0] +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      prik("visninger", SERIEFARVER[1]) + prik("besoeg", SERIEFARVER[0]) + mrk +
      "</svg>" +
      '<div class="tegnf"><span><i style="background:' + SERIEFARVER[0] +
      '"></i>besøg — seneste døgn <b>' + ltal(sidst.besoeg) + "</b></span>" +
      '<span><i style="background:' + SERIEFARVER[1] +
      '"></i>sidevisninger — seneste døgn <b>' + ltal(sidst.visninger) +
      "</b></span></div></div>";
  }

  // ---- Stablede søjler: temaer pr. dag -------------------------------------
  function temasoejler(t) {
    var datoer = (t && t.datoer) || [], serier = (t && t.serier) || [];
    if (!datoer.length || !serier.length) return "";
    var W = 960, H = 186, mV = 40, mH = 10, mT = 10, mB = 22, n = datoer.length;
    var totaler = datoer.map(function (_, i) {
      return serier.reduce(function (s, r) { return s + nul(r.tal[i]); }, 0);
    });
    var top = pentLoft(Math.max.apply(null, totaler.concat([1])));
    var baand = (W - mV - mH) / n;
    var bred = Math.min(20, Math.max(3, baand - 3));   // aldrig hele båndet: luft imellem

    var net = "";
    [0, 0.5, 1].forEach(function (f) {
      var y = mT + (H - mT - mB) * (1 - f);
      net += '<line class="gnet" x1="' + mV + '" y1="' + y.toFixed(1) + '" x2="' +
        (W - mH) + '" y2="' + y.toFixed(1) + '"/><text class="gakse" x="' + (mV - 9) +
        '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        Math.round(top * f) + "</text>";
    });
    var soejler = "";
    datoer.forEach(function (d, i) {
      var x = mV + baand * i + (baand - bred) / 2, y = H - mB;
      serier.forEach(function (r, si) {
        var v = nul(r.tal[i]);
        if (!v) return;
        var h = (H - mT - mB) * v / top;
        y -= h;
        // 2px mellemrum i fladens farve adskiller segmenterne - ikke en streg
        soejler += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' +
          bred.toFixed(1) + '" height="' + Math.max(1, h - 2).toFixed(1) +
          '" rx="1.5" fill="' + SERIEFARVER[si % SERIEFARVER.length] + '"/>';
      });
    });
    var mrk = "";
    [0, Math.floor(n / 2), n - 1].forEach(function (i) {
      mrk += '<text class="gakse" x="' + (mV + baand * i + baand / 2).toFixed(1) +
        '" y="' + (H - 5) + '" text-anchor="' +
        (i === 0 ? "start" : (i === n - 1 ? "end" : "middle")) + '">' +
        dagMrk(datoer[i]) + "</text>";
    });
    var tegn = serier.map(function (r, si) {
      var sum = r.tal.reduce(function (a, b) { return a + nul(b); }, 0);
      return '<span><i style="background:' + SERIEFARVER[si % SERIEFARVER.length] +
        '"></i>' + esc(r.navn) + " <b>" + ltal(sum) + "</b></span>";
    }).join("");
    return '<div class="graf"><svg viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Udgivne artikler pr. tema pr. dag">' +
      net + soejler + mrk + '</svg><div class="tegnf">' + tegn + "</div></div>";
  }

  function temafarve(navn, alle) {
    var i = alle.indexOf(navn);
    return SERIEFARVER[(i < 0 ? 0 : i) % SERIEFARVER.length];
  }

  // Fælles tomme tilstande, så alle tre ruder svarer ens
  // Fire forskellige tilstande, som ikke må forveksles. Datafilen skrives nu
  // ALTID - også uden token - så filens tilstedeværelse siger ingenting
  // længere. Feltet "maaling" gør.
  function laeserTom() {
    if (!harFil) {
      return '<div class="advarsel" style="margin:0"><strong>Der er ingen datafil endnu.</strong> ' +
        "<code>data/laesertal-data.js</code> skrives af crawleren. Kør et crawl — " +
        "eller <code>python3 crawler.py</code> — og genindlæs så den her side.</div>";
    }
    if (L.maaling === "mangler_token") {
      return '<div class="advarsel" style="margin:0"><strong>Læsertallene mangler en nøgle.</strong> ' +
        "Crawleren kan ikke komme til Cloudflare uden GitHub-secret'et " +
        "<code>CLOUDFLARE_API_TOKEN</code>. Opskriften står i " +
        "<code>_redaktion/laesertal-opsaetning.md</code>. Temaerne herunder " +
        "kommer fra vores egne filer og virker uanset.</div>";
    }
    if (L.maaling === "fejl") {
      return '<div class="advarsel" style="margin:0"><strong>Cloudflare svarede ikke.</strong> ' +
        "Nøglen kan være udløbet, eller API'et var nede. Actions-loggen har " +
        "linjen med 📈 og siger hvad der gik galt. Temaerne herunder rammes ikke.</div>";
    }
    if (!harTal) {
      var m = new Date(L.opdateret).toLocaleString("da-DK",
        { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      return '<div class="advarsel" style="margin:0"><strong>Nul besøg på ' +
        esc(String(L.dage || 7)) + " dage.</strong> Hentet " + esc(m) +
        ". Nøglen virker — Cloudflare svarede — så det er ét af tre:" +
        "<ul style='margin:9px 0 0 18px'>" +
        "<li>Der er reelt ingen besøgende endnu. Tjek Cloudflares eget overblik: " +
        "viser det også nul, passer tallet.</li>" +
        "<li>Der læses fra den forkerte konto (flere Cloudflare-konti).</li>" +
        "<li>Site-tag'et i <code>crawler.py</code> passer ikke med sitet i " +
        "Web Analytics. Det er <em>ikke</em> det samme som beacon-tokenet.</li></ul></div>";
    }
    return "";
  }

  function laeserManchet() {
    var m = new Date(L.opdateret).toLocaleString("da-DK",
      { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    return '<p class="manchet">Seneste <strong>' + esc(String(L.dage || 7)) +
      " dage</strong>, målt " + esc(m) + ". Tallene kommer fra Cloudflare, " +
      "som sorterer bots fra — det her er mennesker.</p>";
  }

  // Ældre datafiler mangler de nye felter. Sig det, i stedet for at vise tomt.
  function venterPaaCrawl(hvad) {
    return '<div class="lgodt" style="border-left-color:var(--rav)">' + esc(hvad) +
      " kommer efter næste crawl — datafilen er skrevet før den her del fandtes.</div>";
  }

  // ---- Rude 1: Overblik ----------------------------------------------------
  function laeserOverblikHtml() {
    var ud = "<h1>Læserne</h1>";
    var tom = laeserTom();
    if (tom) {
      return ud + '<p class="manchet">Hvad bliver læst, hvad bliver ikke — og hvem ' +
        "sender folk herind.</p>" + tom;
    }
    ud += laeserManchet();
    ud += '<div class="kpi">' +
      kpiKort(ltal(L.besoeg_i_alt), "besøg") +
      kpiKort(ltal(L.sidevisninger_i_alt), "sidevisninger") +
      kpiKort(ltal(L.ai_chat_besoeg), "besøg fra AI-chats") + "</div>";

    var serie = L.serie || [];
    ud += '<div class="lgruppe">Udviklingen dag for dag</div>';
    ud += serie.length
      ? '<p class="lmanchet">Seneste ' + esc(String(L.serie_dage || 30)) +
        " dage. Nuller i venstre side er ægte: målingen kom først på siden " +
        "22. juli, og aksen er ikke klippet til for at skjule det.</p>" +
        dagskurve(serie)
      : venterPaaCrawl("Dagskurven");

    ud += '<div class="lgruppe">Mest læste sider</div>' +
      '<p class="lmanchet">De 12 mest besøgte. Bjælken viser dem i forhold til ' +
      "hinanden, ikke til det hele.</p>" +
      bjaelker(L.sider.slice(0, 12).map(function (s) {
        return { navn: s.sti, vaerdi: s.besoeg };
      }));
    return ud;
  }

  // ---- Rude 2: Nyhederne ---------------------------------------------------
  function laeserNyhederHtml() {
    var ud = "<h1>Nyhederne</h1>" +
      '<p class="manchet">Hvilke historier bliver læst, og hvad vi skriver om. ' +
      "De to ting er ikke det samme, og de står hver for sig herunder.</p>";
    // Bemærk: her returneres IKKE tidligt. Temaerne kommer fra vores egne
    // filer, så de skal stå der, også når læsertallene mangler.
    var tom = laeserTom();
    var arts = L ? (L.artikler || []) : [];
    var katNavne = (((L || {}).udgivne_temaer || {}).serier || [])
      .map(function (s) { return s.navn; });

    ud += '<div class="lgruppe">Mest læste nyheder</div>';
    if (tom) {
      ud += tom;
    } else if (!L.hasOwnProperty("artikler")) {
      ud += venterPaaCrawl("Listen over mest læste nyheder");
    } else if (!arts.length) {
      ud += '<div class="nul">Ingen artikelsider blev åbnet i perioden. ' +
        "Alle besøg gik til forsiden og de faste sider. Det er dét, der skal " +
        "flyttes: nyhederne er hele grunden til, at siden findes.</div>";
    } else {
      ud += '<p class="lmanchet">Sorteret efter sidevisninger. Farveprikken er ' +
        "artiklens tema. <strong>Klik på en linje</strong> for at se, hvor " +
        "læserne kom fra.</p><div class=\"bjaelker\">" +
        arts.slice(0, 20).map(function (a, i) {
          return '<button class="art" data-art="' + i + '">' +
            '<div class="art-nr">' + (i + 1) + "</div><div>" +
            '<div class="art-rub">' + esc(a.rubrik) + '<span class="art-pil">›</span></div>' +
            '<div class="art-meta">' + (a.kategori
              ? '<i style="background:' + temafarve(a.kategori, katNavne) + '"></i>' +
                esc(a.kategori) + " · " : "") + esc(a.dato || "") + "</div></div>" +
            '<div class="art-tal"><b>' + ltal(a.visninger) + "</b><span>visninger</span></div></button>";
        }).join("") + "</div>";
    }

    var lt = (L || {}).laeste_temaer || [];
    if (lt.length) {
      ud += '<div class="lgruppe">Temaer, der bliver læst</div>' +
        '<p class="lmanchet">Sidevisninger på artikler, lagt sammen pr. tema. ' +
        "Farverne er de samme som i grafen nedenfor.</p>" +
        bjaelker(lt.map(function (t) {
          return { navn: t.navn, vaerdi: t.visninger,
                   farve: temafarve(t.navn, katNavne) };
        }));
    }

    ud += '<div class="lgruppe">Temaer over tid — hvad vi udgiver</div>';
    var ut = (L || {}).udgivne_temaer;
    if (!ut || !(ut.serier || []).length) {
      ud += venterPaaCrawl("Temakurven");
    } else {
      ud += '<p class="lmanchet">Antal artikler udgivet pr. dag, stablet efter tema. ' +
        "Det her er vores egen produktion — ikke hvad folk læste. Tallene i " +
        "tegnforklaringen er perioden i alt.</p>" + temasoejler(ut);
    }
    return ud;
  }

  // ---- Rude 3: Trafikken ---------------------------------------------------
  function laeserTrafikHtml() {
    var ud = "<h1>Hvor de kommer fra</h1>";
    var tom = laeserTom();
    if (tom) {
      return ud + '<p class="manchet">Henvisere, AI-chats og de sider, ingen ' +
        "har åbnet.</p>" + tom;
    }
    ud += laeserManchet();

    var henv = (L.henvisere || []).slice(0, 12);
    ud += '<div class="lgruppe">Henvisere</div>';
    ud += henv.length
      ? '<p class="lmanchet">Værten, browseren kom fra. <strong>direkte</strong> er ' +
        "dem, der skrev adressen selv, havde et bogmærke eller klikkede i en mail.</p>" +

  var HENVISERNAVNE = [
    ["facebook.com", "Facebook"], ["fb.com", "Facebook"],
    ["linkedin.com", "LinkedIn"], ["lnkd.in", "LinkedIn"],
    ["google.", "Google"], ["bing.com", "Bing"],
    ["duckduckgo.com", "DuckDuckGo"], ["t.co", "X/Twitter"],

  function henviserNavn(vaert) {
    if (vaert === "direkte" || vaert === "herfra selv") return vaert;
    var v = String(vaert || "").toLowerCase();
    // Længste match først, så "gemini.google.com" ikke bliver til "Google"
    var bedst = null;
    for (var i = 0; i < HENVISERNAVNE.length; i++) {
      var m = HENVISERNAVNE[i][0];
      if (v.indexOf(m) >= 0 && (!bedst || m.length > bedst[0].length)) {
        bedst = HENVISERNAVNE[i];

    return bedst ? bedst[1] : vaert;
  }

  // Læg værter sammen, der er samme sted: l./m./www.facebook.com -> Facebook
  function samlHenvisere(liste) {
    var pr = {}, orden = [];
    (liste || []).forEach(function (h) {
      var n = henviserNavn(h.fra);
      if (!pr[n]) { pr[n] = { navn: n, visninger: 0, besoeg: 0 }; orden.push(n); }
      pr[n].visninger += nul(h.visninger);
      pr[n].besoeg += nul(h.besoeg);

  var side = document.getElementById("side");

  function tegn() {

  var bag = document.getElementById("bag"), modal = document.getElementById("modal");

    modal.classList.remove("bred");   // næste modal skal starte i normal bredde
  }
  bag.addEventListener("click", function (e) { if (e.target === bag) luk(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") luk(); });

  function aabn(n) {
    var h = S.hjerner[n];
    modal.innerHTML =
      '<button class="luk" id="mLuk">✕</button>' +
      "<h3>" + esc(n.replace(/_/g, " ")) + "</h3>" +

  // ---- Natteloopet: dokumenter i stedet for prompts ----
  var DOK = {};
  (S.natteloop || []).forEach(function (d) { DOK[d.noegle] = d; });
  var dokAendret = {};        // noegle -> ny tekst, kun i denne session

  var NATETAPER = [
    { navn: "Maskinen ser på siden", hvornaar: "én gang i døgnet",
      ikke: [["Den natlige gennemgang", "Måler siden og læsertallene · gemini-3.6-flash — instruksen ligger i flowet ovenfor"]],
      dok: ["maalestok"] },
    { navn: "Den skriver, hvad der bør laves", hvornaar: "3 forslag + et GitHub-issue",
      dok: ["kritik", "opgavekoe"] },
    { navn: "Natsessionen laver det", hvornaar: "kl. 23:00 og 03:00",
      dok: ["natsession"] },
    { navn: "Du læser regnskabet om morgenen", hvornaar: "og pusher",
      dok: ["natlog"] }
  ];

  function dokTekst(k) {
    return dokAendret[k] !== undefined ? dokAendret[k] : (DOK[k] ? DOK[k].indhold : "");
  }
  function dokErAendret(k) {
    return dokAendret[k] !== undefined && DOK[k] && dokAendret[k] !== DOK[k].indhold;
  }

  // ---- Markdown -> HTML, så nat-loggen kan læses i stedet for granskes ----
  // Lille renderer med vilje: panelet åbnes ofte fra file://, hvor vi ikke kan
  // hente et bibliotek. Alt escapes FØR der sættes tags på, så en rubrik fra et
  // fremmed feed i loggen ikke kan finde på noget.
  function mdTekst(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(—])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      // Kun harmløse adresser bliver til links. Loggen citerer rubrikker fra
      // fremmede feeds, og "javascript:" i en markdown-parentes ville ellers
      // blive et klikbart stykke kode.
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (hele, tekst, url) {
        return /^(https?:\/\/|\/|#|mailto:)/i.test(url)
          ? '<a href="' + url + '" rel="noopener">' + tekst + "</a>"
          : hele;
      });
  }

  function mdBlok(md) {
    var l = String(md || "").replace(/\r/g, "").split("\n"), ud = [], i = 0;
    function afsnit(tekst) {
      // "**Fandt:** ..." bliver til et felt med etiket i stedet for fed skrift
      var m = tekst.match(/^\*\*(Fandt|Gjorde|Testede|Til Torben|Fandt ikke):?\*\*\s*([\s\S]*)$/);
      if (m) {
        var klasse = m[1] === "Til Torben" ? " torben" : "";
        return '<div class="lfelt' + klasse + '"><div class="navn">' + esc(m[1]) +
          '</div><div>' + mdTekst(m[2]) + "</div></div>";
      }
      return "<p>" + mdTekst(tekst) + "</p>";
    }
    while (i < l.length) {
      var r = l[i];
      if (!r.trim()) { i++; continue; }
      if (/^```/.test(r)) {                                   // kodeblok
        var kode = []; i++;
        while (i < l.length && !/^```/.test(l[i])) { kode.push(l[i]); i++; }
        i++;
        ud.push("<pre><code>" + esc(kode.join("\n")) + "</code></pre>");
      } else if (/^\s*\|.*\|\s*$/.test(r)) {                  // tabel
        var raek = [];
        while (i < l.length && /^\s*\|.*\|\s*$/.test(l[i])) { raek.push(l[i]); i++; }
        var celler = raek.map(function (x) {
          return x.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        }).filter(function (c) { return !c.every(function (x) { return /^:?-{2,}:?$/.test(x); }); });
        var t = "<table>";
        celler.forEach(function (c, n) {
          t += "<tr>" + c.map(function (x) {
            return n === 0 ? "<th>" + mdTekst(x) + "</th>" : "<td>" + mdTekst(x) + "</td>";
          }).join("") + "</tr>";
        });
        ud.push(t + "</table>");
      } else if (/^>\s?/.test(r)) {                           // citatblok
        var cit = [];
        while (i < l.length && (/^>\s?/.test(l[i]) || (cit.length && !l[i].trim()))) {
          if (!l[i].trim()) { if (i + 1 < l.length && /^>/.test(l[i + 1])) cit.push(""); else break; }
          else cit.push(l[i].replace(/^>\s?/, ""));
          i++;
        }
        ud.push("<blockquote>" + mdBlok(cit.join("\n")) + "</blockquote>");
      } else if (/^\s*([-*]|\d+\.)\s+/.test(r)) {             // liste
        var nummer = /^\s*\d+\./.test(r), punkter = [], nu = null;
        while (i < l.length && (/^\s*([-*]|\d+\.)\s+/.test(l[i]) || (nu !== null && /^\s{2,}\S/.test(l[i])))) {
          var p = l[i].match(/^\s*(?:[-*]|\d+\.)\s+([\s\S]*)$/);
          if (p) { nu = [p[1]]; punkter.push(nu); }
          else if (nu) nu.push(l[i].trim());
          i++;
        }
        ud.push((nummer ? "<ol>" : "<ul>") + punkter.map(function (p) {
          return "<li>" + mdTekst(p.join(" ")) + "</li>";
        }).join("") + (nummer ? "</ol>" : "</ul>"));
      } else if (/^#{1,6}\s+/.test(r)) {                      // overskrift inde i et kort
        ud.push("<h4>" + mdTekst(r.replace(/^#{1,6}\s+/, "")) + "</h4>"); i++;
      } else if (/^(-{3,}|\*{3,})\s*$/.test(r)) {
        ud.push("<hr>"); i++;
      } else {                                                // almindeligt afsnit
        var buf = [];
        while (i < l.length && l[i].trim() && !/^(#{1,6}\s|>|```|\s*\||-{3,}\s*$)/.test(l[i])
               && !/^\s*([-*]|\d+\.)\s+/.test(l[i])) { buf.push(l[i].trim()); i++; }
        if (!buf.length) { i++; continue; }
        ud.push(afsnit(buf.join(" ")));
      }
    }
    return ud.join("");
  }

  // Deler loggen op, så hver nat bliver sit eget kort
  function logHtml(md) {
    var tekst = String(md || "").replace(/\r/g, "");
    var l = tekst.split("\n"), intro = [], dele = [], nu = null;
    l.forEach(function (r) {
      var h = r.match(/^(#{2,3})\s+(.*\S)\s*$/);
      if (h) { nu = { niveau: h[1].length, titel: h[2], krop: [] }; dele.push(nu); return; }
      if (/^#\s+/.test(r)) return;                       // filens egen H1
      (nu ? nu.krop : intro).push(r);
    });
    // introen: alt før første nat. Skillelinjer væk, resten som den er.
    var ud = "";
    var itxt = intro.join("\n").replace(/^\s*-{3,}\s*$/gm, "").trim();
    if (itxt) ud += '<div class="intro">' + mdBlok(itxt) + "</div>";
    if (!dele.length) return ud || mdBlok(tekst);
    var MDR = ["januar", "februar", "marts", "april", "maj", "juni",
               "juli", "august", "september", "oktober", "november", "december"];
    dele.forEach(function (d) {
      // Overskrifterne står som "2026-07-26 · Titel", men regnskabet vender om:
      // "Nattens regnskab · 2026-07-26". Find datoen, hvor den end står, og lad
      // resten være titlen - så også "(første kørsel)" bliver hængende rigtigt.
      var dm = d.titel.match(/(\d{4})-(\d{2})-(\d{2})/);
      var dato = "", titel = d.titel;
      if (dm) {
        dato = parseInt(dm[3], 10) + ". " + MDR[parseInt(dm[2], 10) - 1] + " " + dm[1];
        titel = d.titel.replace(dm[0], "").replace(/\s*·\s*/g, " ")
                       .replace(/\s{2,}/g, " ").trim() || "Natten";
      }
      var regnskab = /regnskab/i.test(d.titel);
      var krop = d.krop.join("\n").replace(/^\s*-{3,}\s*$/gm, "").trim();
      ud += '<article class="lkort' + (regnskab ? " regnskab" : "") + '">' +
        (dato ? '<div class="dato">' + esc(dato) + "</div>" : "") +
        '<div class="titel">' + mdTekst(titel) + "</div>" +
        mdBlok(krop) + "</article>";
    });
    return ud;
  }

  function dokHtml(k) {
    var d = DOK[k];
    if (!d) return "";
    var a = dokErAendret(k);
    return '<button class="dok' + (d.kan_rettes ? "" : " laes") + '" data-dok="' + k + '">' +
      '<div class="n">' + esc(d.navn) + (a ? '<span class="flag">ÆNDRET</span>' : "") +
      (d.findes ? "" : ' <span class="flag" style="color:var(--rav)">FINDES IKKE ENDNU</span>') + "</div>" +
      '<div class="b">' + esc(d.beskrivelse) + "</div>" +
      '<span class="f">' + esc(d.fil) + (d.kan_rettes ? "" : " · kun læsning") + "</span></button>";
  }

  // ---- Køen som liste: parse, vis, byg om ----
  // Filen har tre dele: alt før "## Kø", selve køen, og alt fra "## Klaret".
  // Vi rører kun den midterste, så "Klaret" og "Ting kun Torben kan gøre"
  // altid overlever, uanset hvad der flyttes rundt.
  function parseKoe(tekst) {
    var iKoe = tekst.indexOf("## Kø");
    var iKlaret = tekst.indexOf("## Klaret");
    if (iKoe < 0 || iKlaret < 0 || iKlaret < iKoe) return null;
    var hoved = tekst.slice(0, iKoe + "## Kø".length);
    var hale = tekst.slice(iKlaret);
    var krop = tekst.slice(iKoe + "## Kø".length, iKlaret);
    var blokke = [], nu = null;
    krop.split("\n").forEach(function (l) {
      var h = l.match(/^#{3,4}\s+(.*\S)\s*$/);
      var p = l.match(/^- \[( |x)\] ?(.*)$/);
      if (h) { nu = null; blokke.push({ type: "gruppe", tekst: h[1] }); }
      else if (p) { nu = { type: "punkt", faerdig: p[1] === "x", linjer: [p[2]] }; blokke.push(nu); }
      else if (nu && l.trim()) { nu.linjer.push(l.trim()); }
      else { nu = null; }
    });
    return { hoved: hoved, hale: hale, blokke: blokke };
  }

  function byggKoe(k) {
    var ud = [k.hoved, ""];
    k.blokke.forEach(function (b) {
      if (b.type === "gruppe") { ud.push("", "### " + b.tekst, ""); return; }
      ud.push("- [" + (b.faerdig ? "x" : " ") + "] " + b.linjer[0]);
      b.linjer.slice(1).forEach(function (l) { ud.push("      " + l); });
      ud.push("");
    });
    ud.push("---", "");
    return ud.join("\n").replace(/\n{4,}/g, "\n\n\n") + k.hale;
  }

  function titelAf(p) {
    var m = p.linjer[0].match(/^\*\*(.+?)\*\*/);
    return m ? m[1] : p.linjer[0].replace(/\*\*/g, "");
  }
  function restAf(p) {
    var f = p.linjer[0].replace(/^\*\*.+?\*\*/, "").trim();
    return [f].concat(p.linjer.slice(1)).join(" ")
      .replace(/\*\*/g, "").replace(/\*/g, "").replace(/\s+/g, " ").trim();
  }

  var koeData = null;

  function tegnKoeliste() {
    var vaert = document.getElementById("kliste");
    if (!vaert || !koeData) return;
    var nr = 0;
    var aabne = koeData.blokke.filter(function (b) { return b.type === "punkt" && !b.faerdig; });
    if (!aabne.length) {
      vaert.innerHTML = '<div class="ktom">Køen er tom. Natsessionen fylder den selv, ' +
        "næste gang den gennemgår siden.</div>";
      return;
    }
    vaert.innerHTML = koeData.blokke.map(function (b, i) {
      if (b.type === "gruppe") return '<div class="kgruppe">' + esc(b.tekst) + "</div>";
      if (b.faerdig) return "";
      nr++;
      var rest = restAf(b);
      return '<div class="kpunkt' + (nr === 1 ? " top" : "") + '">' +
        '<span class="knr">' + nr + "</span>" +
        '<div class="ktekst"><div class="ktitel">' + esc(titelAf(b)) + "</div>" +
        (rest ? '<div class="kdetalje">' + esc(rest) + "</div>" : "") + "</div>" +
        '<div class="kknapper">' +
        '<button data-flyt="op" data-i="' + i + '" title="Op">↑</button>' +
        '<button data-flyt="ned" data-i="' + i + '" title="Ned">↓</button>' +
        '<button class="ok" data-flyt="klaret" data-i="' + i + '" title="Markér som klaret">✓</button>' +
        "</div></div>";
    }).join("");
  }

  function koeKlik(ev) {
    var b = ev.target.closest("[data-flyt]");
    if (!b || !koeData) return;
    var i = +b.dataset.i, blokke = koeData.blokke;
    if (b.dataset.flyt === "klaret") {
      var p = blokke.splice(i, 1)[0];
      p.faerdig = true;
      p.linjer[0] += " *(klaret " + new Date().toISOString().slice(0, 10) + ")*";
      koeData.hale = koeData.hale.replace(/^## Klaret\n/,
        "## Klaret\n\n- [x] " + p.linjer[0] + "\n");
    } else {
      var ret = b.dataset.flyt === "op" ? -1 : 1, j = i + ret;
      while (j >= 0 && j < blokke.length && blokke[j].type !== "punkt") j += ret;
      if (j < 0 || j >= blokke.length) return;
      var t = blokke[i]; blokke[i] = blokke[j]; blokke[j] = t;
    }
    dokAendret.opgavekoe = byggKoe(koeData);
    tegnKoeliste();
    var ta = document.getElementById("dTekst");
    if (ta) ta.value = dokAendret.opgavekoe;
    tegn();
  }

  function aabnDok(k) {
    var d = DOK[k];
    var kan = d.kan_rettes;
    if (k === "opgavekoe") {
      koeData = parseKoe(dokTekst(k));
      if (koeData) {
        modal.innerHTML =
          '<button class="luk" id="mLuk">✕</button>' +
          "<h3>Opgavekøen</h3>" +
          '<div class="b">Rækkefølgen er dét, der bliver lavet. Øverste punkt tages i nat. ' +
          "Flyt med pilene, eller markér som klaret med fluebenet.</div>" +
          '<div class="kliste" id="kliste"></div>' +
          '<div class="raekke">' +
          '<button class="k fyldt" id="dGem">Gem opgavekoe.md</button>' +
          '<button class="k" id="dTekstSkift">Rediger som tekst</button>' +
          '<button class="k" id="dFortryd">Fortryd mine ændringer</button></div>' +
          '<div id="tekstrude" hidden><label>Rå fil</label>' +
          '<textarea id="dTekst" spellcheck="false" style="min-height:420px">' +
          esc(dokTekst(k)) + "</textarea></div>";
        // Bred, men ikke i spalter: rækkefølgen ER indholdet i køen, og to
        // spalter ville gøre "flyt op" umulig at følge med øjnene.
        modal.classList.add("bred");
        bag.classList.add("aaben");
        document.body.style.overflow = "hidden";
        tegnKoeliste();
        document.getElementById("kliste").addEventListener("click", koeKlik);
        document.getElementById("mLuk").addEventListener("click", luk);
        document.getElementById("dTekstSkift").addEventListener("click", function () {
          var r = document.getElementById("tekstrude");
          r.hidden = !r.hidden;
          this.textContent = r.hidden ? "Rediger som tekst" : "Skjul teksten";
        });
        document.getElementById("dFortryd").addEventListener("click", function () {
          delete dokAendret.opgavekoe; koeData = null; tegn(); luk();
        });
        gemKnap(k, d, function () {
          var ta = document.getElementById("dTekst");
          return (ta && !document.getElementById("tekstrude").hidden)
            ? ta.value : dokTekst(k);
        });
        return;
      }
    }
    modal.innerHTML =
      '<button class="luk" id="mLuk">✕</button>' +
      "<h3>" + esc(d.navn) + "</h3>" +
      '<div class="b">' + esc(d.beskrivelse) + " · <code>_redaktion/" + esc(d.fil) + "</code></div>" +
      (kan ? "" : '<div class="advarsel">Den her fil skriver maskinen selv. Du kan læse den, ikke rette den.</div>') +
      (kan
        ? "<label>Indhold</label>" +
          '<textarea id="dTekst" spellcheck="false" style="min-height:420px">' +
          esc(dokTekst(k)) + "</textarea>" +
          '<div class="raekke">' +
          '<button class="k fyldt" id="dGem">Gem ' + esc(d.fil) + "</button>" +
          '<button class="k" id="dHent">Hent fil</button>' +
          '<button class="k" id="dFortryd">Fortryd mine ændringer</button></div>'
        : '<div class="laesevis">' + logHtml(dokTekst(k)) +
          '<div class="lslut">Hele filen står i <code>_redaktion/' + esc(d.fil) + "</code></div></div>");
    modal.classList.toggle("bred", !kan);
    bag.classList.add("aaben");
    document.body.style.overflow = "hidden";
    document.getElementById("mLuk").addEventListener("click", luk);
    if (!kan) return;

    function tekst() { return document.getElementById("dTekst").value; }
    document.getElementById("dHent").addEventListener("click", function () {
      dokAendret[k] = tekst(); tegn(); hentDok(d, tekst());
    });
    document.getElementById("dFortryd").addEventListener("click", function () {
      delete dokAendret[k]; tegn(); luk();
    });
    gemKnap(k, d, tekst);
  }

  function hentDok(d, tekst) {
    var b = new Blob([tekst], { type: "text/markdown" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = d.fil;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Fælles gem-knap for alle dokumenter - både listen og den rå tekst.
  function gemKnap(k, d, tekstFn) {
    var knap = document.getElementById("dGem");
    if (!knap) return;
    knap.addEventListener("click", async function () {
      var t = tekstFn();
      dokAendret[k] = t;
      tegn();
      function kvitter(b) {
        knap.textContent = b;
        setTimeout(function () { knap.textContent = "Gem " + d.fil; }, 2200);
      }
      if (!window.showSaveFilePicker) { hentDok(d, t); kvitter("Hentet i stedet ↓"); return; }
      try {
        var h = await window.showSaveFilePicker({
          suggestedName: d.fil,
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }]
        });
        var w = await h.createWritable();
        await w.write(t);
        await w.close();
        kvitter("Gemt ✓ — push nu");
      } catch (fejl) {
        if (fejl && fejl.name === "AbortError") return;
        hentDok(d, t); kvitter("Kunne ikke gemme — hentet ↓");
      }
    });
  }

  function json() {
    var ud = {};
    Object.keys(aendret).forEach(function (n) { if (erAendret(n)) ud[n] = aendret[n]; });
    return JSON.stringify({
      kommentar: "Overstyrer model og instruks pr. arbejdstrin. Kun det, der står her, er ændret - resten kører på crawlerens indbyggede. Slet et trin for at gå tilbage til standard.",
      hjerner: ud
    }, null, 2);
  }

  function hentFil() {
    var b = new Blob([json()], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "hjerner.json";
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById("hent").addEventListener("click", hentFil);

  // Gem direkte i mappen, hvis browseren tillader det. Første gang skal du
  // pege på _redaktion/hjerner.json; derefter husker knappen filen, så længe
  // fanen er åben, og gemmer oveni med ét klik.
  var filhandle = null;
  document.getElementById("gem").addEventListener("click", async function () {
    var k = this, tekst = json();
    function kvitter(besked) {
      k.textContent = besked;
      setTimeout(function () { k.textContent = "Gem i mappen"; }, 2200);
    }
    if (!window.showSaveFilePicker) {
      hentFil();
      kvitter("Hentet i stedet ↓");
      return;
    }
    try {
      if (!filhandle) {
        filhandle = await window.showSaveFilePicker({
          suggestedName: "hjerner.json",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
        });
      }
      var w = await filhandle.createWritable();
      await w.write(tekst);
      await w.close();
      kvitter("Gemt ✓ — push nu");
    } catch (fejl) {
      if (fejl && fejl.name === "AbortError") return;   // du fortrød
      filhandle = null;
      hentFil();
      kvitter("Kunne ikke gemme — hentet ↓");
    }
  });
  document.getElementById("kopier").addEventListener("click", function () {
    var k = this;
    navigator.clipboard.writeText(json()).then(function () {
      k.textContent = "Kopieret ✓";
      setTimeout(function () { k.textContent = "Kopiér JSON"; }, 1600);
    });
  });
  document.getElementById("nulstilAlt").addEventListener("click", function () {
    if (confirm("Nulstil alle trin til crawlerens indbyggede instrukser?")) { aendret = {}; tegn(); }
  });

  tegn();
})();
</script>

</html>
