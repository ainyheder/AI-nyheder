<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AI-nyheder · Kontrolpanel</title>
<!-- Relativ sti med vilje: panelet åbnes fra file://, hvor "/assets/..." peger
     på filsystemets rod og skrifterne derfor slet ikke bliver hentet. -->
<link rel="stylesheet" href="../assets/fonts/skrifter.css">
<style>
:root {
  --bg:#ffffff; --kort:#ffffff; --flade:#f7f6f3; --blaek:#191714; --svag:#6d675d; --linje:#e2ddd2;
  --accent:#5b4bf0; --accent-svag:#ecebfd; --groen:#2e9e5b; --rav:#c2711d; --roed:#b3392b;
  --skygge:0 2px 4px rgba(25,23,20,.05), 0 12px 32px rgba(25,23,20,.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Inter",-apple-system,sans-serif; background:var(--bg); color:var(--blaek); line-height:1.6; }
.topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--linje); padding:14px 28px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.brand { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:22px; letter-spacing:-.03em; }
.brand em { font-style:normal; color:var(--accent); }
.stempel { font-size:12px; color:var(--svag); margin-left:auto; }
.app { display:flex; align-items:stretch; min-height:calc(100vh - 57px); }
.side { width:236px; flex:none; border-right:1px solid var(--linje); background:var(--flade);
  padding:18px 12px 90px; position:sticky; top:57px; align-self:flex-start;
  max-height:calc(100vh - 57px); overflow-y:auto; }
.side-gruppe { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--svag); padding:14px 12px 7px; }
.side-punkt { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  font:inherit; font-size:14.5px; background:none; border:0; border-radius:10px;
  padding:11px 13px; cursor:pointer; color:var(--blaek); line-height:1.35; }
.side-punkt:hover { background:var(--flade); }
.side-punkt.valgt { background:var(--accent-svag); color:var(--accent); font-weight:600; }
.side-punkt .nr { width:22px; height:22px; border-radius:50%; flex:none;
  background:color-mix(in srgb, var(--blaek) 8%, transparent); color:var(--svag);
  font-size:10.5px; font-weight:700; display:grid; place-items:center; }
.side-punkt.valgt .nr { background:var(--accent); color:#fff; }
.side-punkt .prik { width:7px; height:7px; border-radius:50%; background:var(--groen); flex:none; margin-left:auto; }
.ind { flex:1; min-width:0; padding:26px 34px 96px; }
h1 { font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:30px; letter-spacing:-.02em; margin-bottom:6px; }
.manchet { font-size:15px; color:var(--svag); margin-bottom:22px; max-width:80ch; }
h2 { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:20px; margin:0 0 12px; }
@media (max-width:900px) {
  .app { display:block; }
  .side { width:auto; position:static; max-height:none; border-right:0;
    border-bottom:1px solid var(--linje); display:flex; flex-wrap:wrap; gap:4px; padding:10px; }
  .side-gruppe { width:100%; padding:6px 8px 2px; }
  .side-punkt { width:auto; }
  .ind { padding:20px 16px 96px; }
}
.advarsel { background:#fdf3e3; border-left:3px solid var(--rav); border-radius:0 10px 10px 0;
  padding:13px 17px; font-size:14px; margin-bottom:24px; }
.flow { background:var(--kort); border:1px solid var(--linje); border-radius:16px; padding:20px; box-shadow:var(--skygge); }
.flow svg { width:100%; height:auto; display:block; }
/* ---- Sekvenstræet ----------------------------------------------------------
   Etiket til venstre, en lodret akse, kortene til højre. Læses som en
   tidslinje: hvornår sker det, og hvad består det af. Kortene er ens opbygget
   uanset type - ikon, navn, forklaring, og nederst hvad man kan gøre ved dem.
   Farven og ikonet siger typen; teksten i foden gentager den med ord, så
   kortet ikke kræver, at man har lært et farvesystem. */
.forklar { display:flex; flex-wrap:wrap; gap:7px 16px; align-items:center;
  margin:0 0 22px; padding:11px 15px; background:var(--flade);
  border:1px solid var(--linje); border-radius:12px; }
.forklar b { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--svag); }
.forklar i { font-style:normal; display:inline-flex; align-items:center; gap:7px;
  font-size:12.5px; color:var(--blaek); }
.forklar .kk-ikon { width:21px; height:21px; font-size:11px; border-radius:7px; }
/* Ikonfarverne står for sig, så forklaringen og kortene bruger præcis de samme. */
.i-ai   { background:var(--accent-svag); color:var(--accent); }
.i-dok  { background:#f8eeda; color:var(--rav); }
.i-laes, .i-ikke { background:color-mix(in srgb, var(--blaek) 7%, transparent); color:var(--svag); }

.trae { position:relative; }
.trae::before { content:""; position:absolute; left:229px; top:18px; bottom:26px; width:2px;
  background:linear-gradient(180deg, var(--accent) 0%, var(--linje) 100%); border-radius:2px; }
/* Aksen tager farve efter det, den forbinder: lilla for AI-trin, rav for dokumenter. */
.trae-dok::before { background:linear-gradient(180deg, var(--rav) 0%, var(--linje) 100%); }
.etape { display:grid; grid-template-columns:204px 26px minmax(0,1fr); gap:0 13px;
  align-items:start; padding-bottom:26px; }
.etape:last-child { padding-bottom:6px; }
.etape-mrk { padding-top:3px; text-align:right; }
.etape-navn { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:16.5px;
  line-height:1.28; letter-spacing:-.01em; }
.etape-hvornaar { font-size:12px; color:var(--svag); margin-top:4px; }
.etape-tal { display:inline-block; margin-top:8px; font-size:11px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:var(--svag);
  background:color-mix(in srgb, var(--blaek) 6%, transparent);
  border-radius:999px; padding:3px 9px; }
.etape-prik { position:relative; z-index:1; width:26px; height:26px; border-radius:50%;
  background:#fff; border:2px solid var(--accent); color:var(--accent);
  font-size:11.5px; font-weight:700; display:grid; place-items:center; margin-top:4px; }
.etape.dok-etape .etape-prik { border-color:var(--rav); color:var(--rav); }
.net { display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:12px;
  align-items:stretch; }
.pil { text-align:center; color:#b4b2a9; font-size:17px; line-height:1; margin:2px 0 10px; }

/* ---- Ét kort, fire varianter ---- */
.kk { display:flex; flex-direction:column; gap:9px; width:100%; height:100%;
  background:#fff; border:1px solid var(--linje); border-radius:14px;
  padding:13px 15px 12px; text-align:left; font:inherit; color:var(--blaek);
  transition:transform .12s, border-color .12s, box-shadow .12s; }
.kk-klik { cursor:pointer; }
.kk-klik:hover { transform:translateY(-2px); box-shadow:0 5px 16px rgba(25,23,20,.09); }
.kk-hoved { display:flex; gap:10px; align-items:flex-start; }
.kk-ikon { width:27px; height:27px; border-radius:9px; flex:none; display:grid;
  place-items:center; font-size:13px; line-height:1; }
.kk-hoved > span:last-child { flex:1; min-width:0; }
.kk-navn { display:block; font-weight:700; font-size:14.5px; line-height:1.32; }
.kk-b { display:block; font-size:12.5px; color:var(--svag); line-height:1.48; margin-top:3px; }
.kk-fod { margin-top:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.kk-goer { font-size:11.5px; color:var(--svag); margin-left:auto; white-space:nowrap; }
.kk .m, .kk .f { font-family:"JetBrains Mono",monospace; font-size:11px;
  border-radius:6px; padding:2px 8px; display:inline-block; }
.kk .flag { font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--groen);
  margin-left:6px; white-space:nowrap; }
/* AI-trin */
.kk.kk-ai { border-left:3px solid #ded9cd; }
.kk-ai .m { color:var(--accent); background:var(--accent-svag); }
.kk-ai:hover { border-color:var(--accent); }
.kk-ai.aendret { border-left-color:var(--accent); }
/* Dokument man kan skrive i */
.kk.kk-dok { border-color:#ecdfc4; border-left:3px solid var(--rav); }
.kk-dok .f { color:var(--rav); background:#f6ecd8; }
.kk-dok:hover { border-color:var(--rav); }
/* Dokument der kun kan læses */
.kk.kk-laes { background:var(--flade); border-style:dashed; }
.kk-laes .f { color:var(--svag); background:color-mix(in srgb, var(--blaek) 7%, transparent); }
.kk-laes:hover { border-color:var(--svag); }
/* Ikke AI - sker af sig selv */
.kk.kk-ikke { background:var(--flade); border-style:dashed; }
@media (max-width:1080px) {
  .trae::before { display:none; }
  .etape { display:block; padding-bottom:22px; }
  .etape-mrk { text-align:left; display:flex; align-items:baseline; gap:10px;
    flex-wrap:wrap; margin-bottom:11px; padding-top:0; }
  .etape-hvornaar, .etape-tal { margin-top:0; }
  .etape-tal { order:3; }
  .etape-prik { display:none; }
}
/* Køen som læsbar liste */
.kliste { margin:4px 0 0; }
.kgruppe { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--svag); margin:20px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linje); }
.kgruppe:first-child { margin-top:4px; }
.kpunkt { display:flex; gap:12px; align-items:flex-start; background:var(--kort);
  border:1px solid var(--linje); border-radius:11px; padding:11px 13px; margin-bottom:7px; }
.kpunkt.top { border-color:var(--accent); border-left:4px solid var(--accent); }
.knr { width:22px; height:22px; border-radius:50%; flex:none; margin-top:1px;
  background:color-mix(in srgb, var(--blaek) 7%, transparent); color:var(--svag);
  font-size:11px; font-weight:700; display:grid; place-items:center; }
.kpunkt.top .knr { background:var(--accent); color:#fff; }
.ktekst { flex:1; min-width:0; }
.ktitel { font-size:14px; font-weight:600; line-height:1.4; }
.kdetalje { font-size:12.5px; color:var(--svag); line-height:1.5; margin-top:3px; }
.kknapper { display:flex; gap:3px; flex:none; }
.kknapper button { width:27px; height:27px; border-radius:7px; border:1px solid var(--linje);
  background:var(--bg); cursor:pointer; font-size:12px; color:var(--svag); line-height:1; padding:0; }
.kknapper button:hover { border-color:var(--accent); color:var(--accent); }
.kknapper button.ok:hover { border-color:var(--groen); color:var(--groen); }
.ktom { color:var(--svag); font-size:14px; padding:20px 0; }
.kpunkt.venter { border-color:#ecdfc4; border-left:4px solid var(--rav); background:#fffdf8; }
.kpunkt.venter .knr { background:#f6ecd8; color:var(--rav); }
.kknapper button.nej:hover { border-color:var(--roed); color:var(--roed); }
.kpunkt.fravaelg { border-color:#e8d2cd; border-left:4px solid var(--roed); background:#fffaf9; }
.kpunkt.fravaelg .knr { background:#f7e3df; color:var(--roed); }
.kgrund { width:100%; margin-top:9px; padding:7px 10px; font:inherit; font-size:13.5px;
  border:1px solid var(--linje); border-radius:8px; background:var(--kort); color:var(--blaek); }
.kgrund:focus { outline:none; border-color:var(--roed); }
.kgrund.mangler { border-color:var(--roed); background:#fff5f4; }

/* Historik: samme kort som køen, men hele rækken er en knap. Klassen ligger
   oven på .kpunkt, så listen ikke driver fra køen, når køens look ændres. */
.hpost { cursor:pointer; width:100%; text-align:left; font:inherit; color:inherit; }
.hpost:hover { border-color:var(--accent); }
.hpost .ktitel, .hpost .kdetalje { display:block; }
.hpost.regnskab { background:var(--accent-svag); border-color:#cfcafb; }
.hpost.regnskab .knr { background:#fff; color:#4438c9; }
.hpost.sprang { background:var(--bg); }
.hpost.sprang .ktitel { font-weight:500; color:var(--svag); }
.htid { font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--svag);
  flex:none; margin-top:3px; white-space:nowrap; }
.hslut { color:var(--svag); font-size:13px; margin-top:24px; padding-top:13px;
  border-top:1px solid var(--linje); }

/* ---- Ønsker: en formular, ikke en tekstfil ---- */
.oe-top { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.oe-ny { display:inline-flex; align-items:center; gap:9px; font:inherit; font-size:15px;
  font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:999px;
  padding:13px 26px; cursor:pointer; box-shadow:0 2px 10px rgba(91,75,240,.28); }
.oe-ny:hover { opacity:.92; }
.oe-ny span { font-size:19px; line-height:1; margin-top:-2px; }
.oe-form { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:22px 24px; margin-bottom:20px; box-shadow:var(--skygge); }
.oe-form h4 { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:18px; margin-bottom:4px; }
.oe-form .hj-tekst { font-size:13.5px; color:var(--svag); margin-bottom:14px; }
.oe-felt { width:100%; font:inherit; font-size:15px; padding:12px 15px; border:1px solid var(--linje);
  border-radius:11px; background:var(--bg); color:var(--blaek); }
.oe-felt:focus { outline:2px solid var(--accent); border-color:transparent; background:var(--kort); }
textarea.oe-felt { min-height:96px; resize:vertical; font-size:14.5px; line-height:1.6; }
.oe-mrk { display:block; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--svag); margin:16px 0 7px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.laesfaner { display:flex; gap:8px; flex-wrap:wrap; margin:-8px 0 22px; }
.chip { font:inherit; font-size:13.5px; background:var(--bg); border:1px solid var(--linje);
  border-radius:999px; padding:8px 16px; cursor:pointer; color:var(--blaek); }
.chip:hover { border-color:var(--accent); }
.chip.valgt { background:var(--accent-svag); border-color:var(--accent); color:var(--accent); font-weight:600; }
.chip.haster.valgt { background:#fdece4; border-color:var(--rav); color:var(--rav); }
.oe-kort { background:var(--kort); border:1px solid var(--linje); border-left:4px solid var(--accent);
  border-radius:13px; padding:15px 17px; margin-bottom:9px; display:flex; gap:14px; align-items:flex-start; }
.oe-kort.haster { border-left-color:var(--rav); background:#fffaf4; }
.oe-kort.faerdig { border-left-color:var(--groen); opacity:.72; }
.oe-krop { flex:1; min-width:0; }
.oe-titel { font-size:15px; font-weight:600; line-height:1.4; }
.oe-mere { font-size:13.5px; color:var(--svag); line-height:1.55; margin-top:4px; }
.oe-maerker { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
.maerke { font-size:11px; font-weight:700; letter-spacing:.03em; border-radius:6px; padding:3px 9px;
  background:color-mix(in srgb, var(--blaek) 7%, transparent); color:var(--svag); }
.maerke.haster { background:#fdece4; color:var(--rav); }
.maerke.groen { background:#e3f4ea; color:var(--groen); }
.oe-knapper { display:flex; gap:4px; flex:none; }
.oe-knapper button { width:30px; height:30px; border-radius:8px; border:1px solid var(--linje);
  background:var(--bg); cursor:pointer; font-size:13px; color:var(--svag); padding:0; line-height:1; }
.oe-knapper button:hover { border-color:var(--accent); color:var(--accent); }
.oe-tom { text-align:center; padding:40px 24px; color:var(--svag); font-size:15px;
  background:var(--kort); border:1px dashed var(--linje); border-radius:16px; }
/* .hj og .dok er nu rene kroge, som klik-lytteren finder kortene på.
   Alt udseende ligger i .kk-varianterne ovenfor. */
/* Læsertal. Én måleenhed (besøg), så én farve - accenten. Tallene står i
   tekstfarver, aldrig i accentfarven: en lys farve er ulæselig som tekst. */
.kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:12px; }
.kpi-kort { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:15px 18px 16px; box-shadow:var(--skygge); }
.kpi-tal { font-size:33px; font-weight:600; letter-spacing:-.022em; line-height:1.12; }
.kpi-mrk { font-size:12.5px; color:var(--svag); margin-top:3px; }
.lgruppe { font-family:"Fraunces",Georgia,serif; font-weight:800; font-size:18px; margin:28px 0 4px; }
.lmanchet { font-size:13px; color:var(--svag); margin-bottom:11px; max-width:74ch; }
.bjaelker { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:4px 18px 6px; box-shadow:var(--skygge); }
.bj { display:grid; grid-template-columns:minmax(0,1fr) 62px; gap:14px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--linje); }
.bj:last-child { border-bottom:0; }
.bj-navn { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 8px tynd bjælke, firkantet ved nulpunktet og rundet i den ende, der bærer
   værdien - så øjet kan se, hvor tallet slutter. */
.bj-spor { height:8px; margin-top:6px; border-radius:0 4px 4px 0;
  background:color-mix(in srgb, var(--accent) 13%, transparent); }
.bj-fyld { height:100%; border-radius:0 4px 4px 0; background:var(--accent); }
.bj-tal { font-size:13px; text-align:right; color:var(--svag); font-variant-numeric:tabular-nums; }
.nul { background:#fdf9ef; border:1px solid #e8dcc0; border-left:4px solid var(--rav);
  border-radius:12px; padding:14px 17px; }
.nul-liste { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.nul-liste code { font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--rav);
  background:#f6ecd8; border-radius:6px; padding:3px 9px; }
.lgodt { background:var(--kort); border:1px solid var(--linje); border-left:4px solid var(--groen);
  border-radius:12px; padding:14px 17px; font-size:14px; }
/* Grafer. Tegnet i hånden som SVG - panelet åbnes fra file:// og må ikke
   afhænge af et bibliotek, der skal hentes. */
.graf { background:var(--kort); border:1px solid var(--linje); border-radius:16px;
  padding:15px 18px 11px; box-shadow:var(--skygge); }
.graf svg { width:100%; height:auto; display:block; overflow:visible; }
.gnet { stroke:#e1e0d9; stroke-width:1; }
.gakse { fill:#898781; font-size:10.5px; font-family:"Inter",sans-serif; }
.gvaerdi { fill:var(--blaek); font-size:11px; font-weight:600; font-family:"Inter",sans-serif; }
/* Tegnforklaring. Ved to eller flere serier er den obligatorisk - farve alene
   må aldrig være det eneste, der adskiller dem. */
.tegnf { display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:11px;
  font-size:12.5px; color:var(--svag); }
.tegnf span { display:inline-flex; align-items:center; gap:6px; }
.tegnf i { width:10px; height:10px; border-radius:3px; flex:none; }
.tegnf b { color:var(--blaek); font-weight:600; font-variant-numeric:tabular-nums; }
/* Artikelliste med tema-prik. Hele rækken er en knap - klik åbner detaljerne. */
.art { display:grid; grid-template-columns:22px minmax(0,1fr) 68px; gap:11px;
  align-items:baseline; padding:11px 0; border-bottom:1px solid var(--linje);
  width:100%; text-align:left; font:inherit; background:none; border-left:0;
  border-right:0; border-top:0; cursor:pointer; }
.art:last-child { border-bottom:0; }
.art:hover { background:color-mix(in srgb, var(--accent) 5%, transparent); }
.art:hover .art-rub { color:var(--accent); }
.art-pil { font-size:11px; color:var(--svag); margin-left:6px; }
.art-nr { font-size:11px; font-weight:700; color:var(--svag); text-align:right;
  font-variant-numeric:tabular-nums; }
.art-rub { font-size:14px; line-height:1.4; }
.art-meta { font-size:11.5px; color:var(--svag); margin-top:3px; }
.art-meta i { width:8px; height:8px; border-radius:50%; display:inline-block;
  margin-right:5px; vertical-align:baseline; }
.art-tal { text-align:right; font-size:13px; font-variant-numeric:tabular-nums; }
.art-tal b { display:block; font-size:15px; font-weight:600; color:var(--blaek); }
.art-tal span { font-size:11px; color:var(--svag); }
.bag { display:none; position:fixed; inset:0; z-index:200; background:rgba(25,23,20,.55);
  backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px; }
.bag.aaben { display:flex; }

/* ---- Læsevisning af loggen og analysen -------------------------- */

</div>

<div class="bag" id="bag"><div class="modal" id="modal"></div></div>

<script src="../data/hjerne-data.js" onerror="window.HJERNE_MANGLER=true"></script>
<!-- Læsertallene. Filen findes først, når CLOUDFLARE_API_TOKEN er sat som
     GitHub-secret; indtil da siger Læserne-ruden selv, hvad der mangler. -->
<script src="../data/laesertal-data.js" onerror="window.LAESERTAL_MANGLER=true"></script>
<!-- Hvad hver nyhedskilde leverede. Skrives af crawleren ved HVER kørsel, også
     på GitHub Actions - crawleren er eneste skribent, så der er ingen
     flettekonflikt at frygte. Se skriv_kilde_status i crawler.py. -->
<script src="../data/kilder-data.js" onerror="window.KILDER_MANGLER=true"></script>
<script>
(function () {
  var S = window.HJERNE_STATUS;
  var adv = document.getElementById("advarsel");

  if (!S) {
    document.getElementById("tomboks").hidden = false;
    document.getElementById("tomboks").innerHTML =
      "Kunne ikke finde <code>hjerne-data.js</code>.<br><br>" +
      "Filen skrives af crawleren. Kør et crawl (eller <code>python3 crawler.py</code>) én gang, " +
      "og genindlæs så denne side.";
    
    return;
  }

  document.getElementById("stempel").textContent =
    "Målt " + new Date(S.opdateret).toLocaleString("da-DK") +
    " · daglig model: " + S.daglig_model;

  if (!S.gemini_tilgaengelig) {
    adv.hidden = false;
    adv.innerHTML = "<strong>Ingen Google-nøgle sat.</strong> Vælger du en Gemini-model " +
      "til et trin, bliver den ignoreret, og trinnet kører videre på den daglige model.";
  }

  var MODELLER = [
    ["", "Brug den daglige model (" + S.daglig_model + ")"],
    ["gemini-3.6-flash", "Gemini 3.6 Flash — klogest, dyrest"],
    ["gemini-3.5-flash", "Gemini 3.5 Flash — midt imellem"],
    ["gemini-3.5-flash-lite", "Gemini 3.5 Flash Lite — billigst, hurtigst"],
    ["gemini-3.1-flash-lite", "Gemini 3.1 Flash Lite — forrige generation"]
  ];

  // Ændringer i denne session. navn -> {model?, prompt?}
  var aendret = {};
  Object.keys(S.hjerner).forEach(function (n) {
    var h = S.hjerner[n], e = {};
    if (h.egen_model) e.model = h.model;
    if (h.egen_prompt) e.prompt = h.aktiv_prompt;
    if (e.model || e.prompt) aendret[n] = e;
  });

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  /* esc() dækker & < >, men IKKE anførselstegn — den blev skrevet til tekst
     MELLEM tags. Bruges den i en attributværdi, kan et " bryde ud og tilføje
     fx onmouseover=. Kildenavne og links kommer fra fremmede RSS-feeds og fra
     et felt, redaktionen selv skriver, så begge veje er reelle: et link med et
     " kørte kode i panelet, og en kilde ved navn Wired "AI" ødelagde
     fold-ud-knappen uden en eneste fejlbesked. */
  function escA(s) { return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  function aktivModel(n) {
    if (aendret[n] && aendret[n].model) return aendret[n].model;
    return n === "gennemgang" ? S.kritik_model : S.daglig_model;
  }
  function aktivPrompt(n) {
    if (aendret[n] && aendret[n].prompt) return aendret[n].prompt;
    return S.hjerner[n].standard_prompt;
  }
  function erAendret(n) {
    var e = aendret[n]; if (!e) return false;
    if (e.model) return true;
    return !!(e.prompt && e.prompt.trim() !== (S.hjerner[n].standard_prompt || "").trim());
  }

  // Rækkefølgen crawleren faktisk arbejder i.
  var ETAPER = [
    { navn: "Hent nyhederne", hvornaar: "hver kørsel",
      ikke: [["RSS-kilderne", "opsaetning/feeds.json — 11 kilder, ingen AI"]] },
    { navn: "Skriv historien på dansk", hvornaar: "kun nye artikler",
      trin: ["omskriv", "kategori", "dublet", "brief", "redaktoer"] },
    { navn: "Hold arkivet i orden", hvornaar: "lidt ad gangen hver kørsel",
      trin: ["navngiv", "stram"] },
    { navn: "Lav billederne", hvornaar: "kun dagens top-5",
      trin: ["motiv"],
      ikke: [["Billedmodellen", "Tegner selve billedet — vælges ikke her"]] },
    { navn: "Byg siderne", hvornaar: "hver kørsel",
      ikke: [["Artikelsider, RSS og sitemap", "Ren filskrivning, ingen AI"]] },
    { navn: "De faste indslag", hvornaar: "én gang om dagen eller ugen",
      trin: ["dagens_overblik", "kartotek", "quiz", "ugens_overblik"] },
    { navn: "YouTube", hvornaar: "op til 14 videoer pr. kørsel",
      trin: ["youtube"] },
    { navn: "Ud i verden", hvornaar: "max 2 opslag om dagen",
      trin: ["opslag"] }
  ];

  // Alle kort i træet bygges her, så de fire typer bliver ens opbygget og
  // kun adskiller sig på ikon, farve og hvad foden siger.
  function kortHtml(o) {
    return "<" + (o.klik ? "button" : "div") + ' class="kk ' + o.type +
      (o.klik ? " kk-klik" : "") + (o.ekstra || "") + '"' + (o.data || "") + ">" +
      '<div class="kk-hoved"><span class="kk-ikon i-' + o.type.slice(3) + '">' + o.ikon + "</span>" +
      '<span><span class="kk-navn">' + esc(o.navn) + (o.maerker || "") + "</span>" +
      '<span class="kk-b">' + esc(o.beskrivelse) + "</span></span></div>" +
      '<div class="kk-fod">' + (o.mrk || "") +
      (o.goer ? '<span class="kk-goer">' + esc(o.goer) + "</span>" : "") +
      "</div></" + (o.klik ? "button" : "div") + ">";
  }

  function trinHtml(n) {
    var h = S.hjerner[n], a = erAendret(n);
    return kortHtml({
      type: "kk-ai", ikon: "◆", klik: true, ekstra: " hj" + (a ? " aendret" : ""),
      data: ' data-n="' + n + '"', navn: n.replace(/_/g, " "),
      maerker: a ? '<span class="flag">ÆNDRET</span>' : "",
      beskrivelse: h.beskrivelse,
      mrk: '<span class="m">' + esc(aktivModel(n)) + "</span>",
      goer: "Skift model eller instruks"
    });
  }

  // ---- Læserne -------------------------------------------------------------
  // window.LAESERTAL skrives af crawleren (hent_laesertal i crawler.py).
  // Mangler den, er Cloudflare-tokenet ikke sat - og så siger ruden det selv.
  var L = window.LAESERTAL;
  // To forskellige tilstande, som ikke må forveksles: ingen fil betyder, at
  // tokenet mangler. En fil uden sider betyder, at målingen kører fint - men
  // at Cloudflare ikke har registreret ét eneste besøg. Det er to helt
  // forskellige problemer, og de skal have hver sin besked.
  var harFil = !!L;
  var harTal = !!(L && L.sider && L.sider.length);

  function ltal(n) { return (n == null ? 0 : n).toLocaleString("da-DK"); }

  function kpiKort(vaerdi, maerkat) {
    return '<div class="kpi-kort"><div class="kpi-tal">' + esc(vaerdi) + "</div>" +
      '<div class="kpi-mrk">' + esc(maerkat) + "</div></div>";
  }

  // Én måleenhed pr. liste, så bjælkerne må gerne dele farve. Bredden er
  // relativ til den største i listen - ikke til det samlede antal besøg.
  // r.farve er valgfri. Er den sat, følger farven ENTITETEN - så en kategori
  // har samme farve her som i temagrafen. Uden den bruges accenten, fordi
  // listen så kun måler én ting og ikke skal farvekodes overhovedet.
  function bjaelker(raekker) {
    var storst = raekker.reduce(function (m, r) { return Math.max(m, r.vaerdi); }, 0);
    return '<div class="bjaelker">' + raekker.map(function (r) {
      // Gulv på 2%, så en række med ét enkelt besøg stadig er synlig.
      var pct = storst > 0 ? Math.max(2, r.vaerdi / storst * 100) : 0;
      var f = r.farve
        ? ' style="width:' + pct.toFixed(1) + '%;background:' + r.farve + '"'
        : ' style="width:' + pct.toFixed(1) + '%"';
      var spor = r.farve
        ? ' style="background:color-mix(in srgb, ' + r.farve + ' 13%, transparent)"' : "";
      return '<div class="bj"><div><div class="bj-navn" title="' + esc(r.navn) + '">' +
        esc(r.navn) + '</div><div class="bj-spor"' + spor + '><div class="bj-fyld"' +
        f + "></div></div></div>" +
        '<div class="bj-tal">' + ltal(r.vaerdi) + "</div></div>";
    }).join("") + "</div>";
  }

  // Farver til flere serier. Valideret palet (kørt mod hvid flade): alle
  // nabopar klarer både farveblindheds- og normalsynsgulvet. RÆKKEFØLGEN er
  // selve sikkerheden - byt ikke om på den uden at validere igen. Tre af dem
  // har under 3:1 kontrast mod hvid, derfor står der altid en skreven
  // tegnforklaring med tal ved siden af; farven er aldrig eneste kendetegn.
  var SERIEFARVER = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"];

  // Runde akse-tal i stedet for 27. Trinene er tætte med vilje: med kun
  // 1/2/2,5/5 blev et maksimum på 27 til en akse på 50, og så lå søjlerne
  // mast ned i nederste femtedel af grafen.
  function pentLoft(m) {
    var p = Math.pow(10, Math.floor(Math.log(Math.max(m, 1)) / Math.LN10));
    var trin = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < trin.length; i++) if (p * trin[i] >= m) return p * trin[i];
    return p * 10;
  }

  function dagMrk(iso) {
    return new Date(iso + "T12:00:00").toLocaleDateString("da-DK",
      { day: "numeric", month: "short" });
  }

  function nul(v) { return (v == null ? 0 : v); }

  // ---- Kurve: besøg og sidevisninger pr. dag -------------------------------
  function dagskurve(serie) {
    var W = 960, H = 186, mV = 48, mH = 14, mT = 10, mB = 22, n = serie.length;
    var raa = 1;
    serie.forEach(function (d) { raa = Math.max(raa, nul(d.visninger), nul(d.besoeg)); });
    var top = pentLoft(raa);
    function bx(i) { return mV + (W - mV - mH) * (n === 1 ? 0.5 : i / (n - 1)); }
    function by(v) { return mT + (H - mT - mB) * (1 - nul(v) / top); }

    var net = "";
    [0, 0.5, 1].forEach(function (f) {
      var y = by(top * f);
      net += '<line class="gnet" x1="' + mV + '" y1="' + y.toFixed(1) + '" x2="' +
        (W - mH) + '" y2="' + y.toFixed(1) + '"/><text class="gakse" x="' + (mV - 9) +
        '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        ltal(Math.round(top * f)) + "</text>";
    });
    function linje(felt) {
      return serie.map(function (d, i) {
        return (i ? "L" : "M") + bx(i).toFixed(1) + " " + by(d[felt]).toFixed(1);
      }).join(" ");
    }
    var vask = "M" + bx(0).toFixed(1) + " " + by(0).toFixed(1) + " " +
      serie.map(function (d, i) {
        return "L" + bx(i).toFixed(1) + " " + by(d.visninger).toFixed(1);
      }).join(" ") + " L" + bx(n - 1).toFixed(1) + " " + by(0).toFixed(1) + " Z";

    var mrk = "";
    [0, Math.floor(n / 2), n - 1].forEach(function (i) {
      mrk += '<text class="gakse" x="' + bx(i).toFixed(1) + '" y="' + (H - 5) +
        '" text-anchor="' + (i === 0 ? "start" : (i === n - 1 ? "end" : "middle")) +
        '">' + dagMrk(serie[i].dato) + "</text>";
    });
    var sidst = serie[n - 1];
    // Prikkerne har en 2px hvid ring, så de kan ses, hvor kurverne krydser
    function prik(felt, farve) {
      return '<circle cx="' + bx(n - 1).toFixed(1) + '" cy="' + by(sidst[felt]).toFixed(1) +
        '" r="4" fill="' + farve + '" stroke="#fff" stroke-width="2"/>';
    }
    return '<div class="graf"><svg viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Besøg og sidevisninger pr. dag">' + net +
      '<path d="' + vask + '" fill="' + SERIEFARVER[1] + '" fill-opacity="0.10"/>' +
      '<path d="' + linje("visninger") + '" fill="none" stroke="' + SERIEFARVER[1] +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + linje("besoeg") + '" fill="none" stroke="' + SERIEFARVER[0] +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      prik("visninger", SERIEFARVER[1]) + prik("besoeg", SERIEFARVER[0]) + mrk +
      "</svg>" +
      '<div class="tegnf"><span><i style="background:' + SERIEFARVER[0] +
      '"></i>besøg — seneste døgn <b>' + ltal(sidst.besoeg) + "</b></span>" +
      '<span><i style="background:' + SERIEFARVER[1] +
      '"></i>sidevisninger — seneste døgn <b>' + ltal(sidst.visninger) +
      "</b></span></div></div>";
  }

  // ---- Stablede søjler: temaer pr. dag -------------------------------------
  function temasoejler(t) {
    var datoer = (t && t.datoer) || [], serier = (t && t.serier) || [];
    if (!datoer.length || !serier.length) return "";
    var W = 960, H = 186, mV = 40, mH = 10, mT = 10, mB = 22, n = datoer.length;
    var totaler = datoer.map(function (_, i) {
      return serier.reduce(function (s, r) { return s + nul(r.tal[i]); }, 0);
    });
    var top = pentLoft(Math.max.apply(null, totaler.concat([1])));
    var baand = (W - mV - mH) / n;
    var bred = Math.min(20, Math.max(3, baand - 3));   // aldrig hele båndet: luft imellem

    var net = "";
    [0, 0.5, 1].forEach(function (f) {
      var y = mT + (H - mT - mB) * (1 - f);
      net += '<line class="gnet" x1="' + mV + '" y1="' + y.toFixed(1) + '" x2="' +
        (W - mH) + '" y2="' + y.toFixed(1) + '"/><text class="gakse" x="' + (mV - 9) +
        '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' +
        Math.round(top * f) + "</text>";
    });
    var soejler = "";
    datoer.forEach(function (d, i) {
      var x = mV + baand * i + (baand - bred) / 2, y = H - mB;
      serier.forEach(function (r, si) {
        var v = nul(r.tal[i]);
        if (!v) return;
        var h = (H - mT - mB) * v / top;
        y -= h;
        // 2px mellemrum i fladens farve adskiller segmenterne - ikke en streg
        soejler += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' +
          bred.toFixed(1) + '" height="' + Math.max(1, h - 2).toFixed(1) +
          '" rx="1.5" fill="' + SERIEFARVER[si % SERIEFARVER.length] + '"/>';
      });
    });
    var mrk = "";
    [0, Math.floor(n / 2), n - 1].forEach(function (i) {
      mrk += '<text class="gakse" x="' + (mV + baand * i + baand / 2).toFixed(1) +
        '" y="' + (H - 5) + '" text-anchor="' +
        (i === 0 ? "start" : (i === n - 1 ? "end" : "middle")) + '">' +
        dagMrk(datoer[i]) + "</text>";
    });
    var tegn = serier.map(function (r, si) {
      var sum = r.tal.reduce(function (a, b) { return a + nul(b); }, 0);
      return '<span><i style="background:' + SERIEFARVER[si % SERIEFARVER.length] +
        '"></i>' + esc(r.navn) + " <b>" + ltal(sum) + "</b></span>";
    }).join("");
    return '<div class="graf"><svg viewBox="0 0 ' + W + " " + H +
      '" role="img" aria-label="Udgivne artikler pr. tema pr. dag">' +
      net + soejler + mrk + '</svg><div class="tegnf">' + tegn + "</div></div>";
  }

  function temafarve(navn, alle) {
    var i = alle.indexOf(navn);
    return SERIEFARVER[(i < 0 ? 0 : i) % SERIEFARVER.length];
  }

  // Fælles tomme tilstande, så alle tre ruder svarer ens
  // Fire forskellige tilstande, som ikke må forveksles. Datafilen skrives nu
  // ALTID - også uden token - så filens tilstedeværelse siger ingenting
  // længere. Feltet "maaling" gør.
  function laeserTom() {
    if (!harFil) {
      return '<div class="advarsel" style="margin:0"><strong>Der er ingen datafil endnu.</strong> ' +
        "<code>data/laesertal-data.js</code> skrives af crawleren. Kør et crawl — " +
        "eller <code>python3 crawler.py</code> — og genindlæs så den her side.</div>";
    }
    if (L.maaling === "mangler_token") {
      return '<div class="advarsel" style="margin:0"><strong>Læsertallene mangler en nøgle.</strong> ' +
        "Crawleren kan ikke komme til Cloudflare uden GitHub-secret'et " +
        "<code>CLOUDFLARE_API_TOKEN</code>. Opskriften står i " +
        "<code>_redaktion/laesertal-opsaetning.md</code>. Temaerne herunder " +
        "kommer fra vores egne filer og virker uanset.</div>";
    }
    if (L.maaling === "fejl") {
      return '<div class="advarsel" style="margin:0"><strong>Cloudflare svarede ikke.</strong> ' +
        "Nøglen kan være udløbet, eller API'et var nede. Actions-loggen har " +
        "linjen med 📈 og siger hvad der gik galt. Temaerne herunder rammes ikke.</div>";
    }
    if (!harTal) {
      var m = new Date(L.opdateret).toLocaleString("da-DK",
        { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      return '<div class="advarsel" style="margin:0"><strong>Nul besøg på ' +
        esc(String(L.dage || 7)) + " dage.</strong> Hentet " + esc(m) +
        ". Nøglen virker — Cloudflare svarede — så det er ét af tre:" +
        "<ul style='margin:9px 0 0 18px'>" +
        "<li>Der er reelt ingen besøgende endnu. Tjek Cloudflares eget overblik: " +
        "viser det også nul, passer tallet.</li>" +
        "<li>Der læses fra den forkerte konto (flere Cloudflare-konti).</li>" +
        "<li>Site-tag'et i <code>crawler.py</code> passer ikke med sitet i " +
        "Web Analytics. Det er <em>ikke</em> det samme som beacon-tokenet.</li></ul></div>";
    }
    return "";
  }

  function laeserManchet() {
    var m = new Date(L.opdateret).toLocaleString("da-DK",
      { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
    return '<p class="manchet">Seneste <strong>' + esc(String(L.dage || 7)) +
      " dage</strong>, målt " + esc(m) + ". Tallene kommer fra Cloudflare, " +
      "som sorterer bots fra — det her er mennesker.</p>";
  }

  // Ældre datafiler mangler de nye felter. Sig det, i stedet for at vise tomt.
  function venterPaaCrawl(hvad) {
    return '<div class="lgodt" style="border-left-color:var(--rav)">' + esc(hvad) +
      " kommer efter næste crawl — datafilen er skrevet før den her del fandtes.</div>";
  }

  // ---- Rude 1: Overblik ----------------------------------------------------
  function laeserOverblikHtml() {

    ud += '<div class="kpi">' +
      kpiKort(ltal(L.besoeg_i_alt), "besøg") +

    ud += serie.length

      : venterPaaCrawl("Dagskurven");

      bjaelker(L.sider.slice(0, 12).map(function (s) {

  // ---- Rude 2: Nyhederne ---------------------------------------------------
  function laeserNyhederHtml() {

    var tom = laeserTom();

    } else if (!L.hasOwnProperty("artikler")) {

            '<div class="art-rub">' + esc(a.rubrik) + '<span class="art-pil">›</span></div>' +
            '<div class="art-meta">' + (a.kategori
              ? '<i style="background:' + temafarve(a.kategori, katNavne) + '"></i>' +
                esc(a.kategori) + " · " : "") + esc(a.dato || "") + "</div></div>" +
            '<div class="art-tal"><b>' + ltal(a.visninger) + "</b><span>visninger</span></div></button>";
        }).join("") + "</div>";

    var lt = (L || {}).laeste_temaer || [];
    if (lt.length) {

                   farve: temafarve(t.navn, katNavne) };

    ud += '<div class="lgruppe">Temaer over tid — hvad vi udgiver</div>';
    var ut = (L || {}).udgivne_temaer;
    if (!ut || !(ut.serier || []).length) {
      ud += venterPaaCrawl("Temakurven");
    } else {
      ud += '<p class="lmanchet">Antal artikler udgivet pr. dag, stablet efter tema. ' +
        "Det her er vores egen produktion — ikke hvad folk læste. Tallene i " +
        "tegnforklaringen er perioden i alt.</p>" + temasoejler(ut);
    }
    return ud;
  }

  // ---- Rude 3: Trafikken ---------------------------------------------------
  function laeserTrafikHtml() {
    var ud = "<h1>Hvor de kommer fra</h1>";

        bjaelker(henv.map(function (h) { return { navn: h.fra, vaerdi: h.besoeg }; }))
      : '<p class="lmanchet">Ingen henvisere registreret i perioden.</p>';

    var chats = L.ai_chats || [];
    ud += '<div class="lgruppe">Fundet i AI-chats</div>';

      ? '<p class="lmanchet">Besøg, hvor nogen klikkede sig herind fra en AI-chat.</p>' +
        bjaelker(chats.map(function (c) { return { navn: c.navn, vaerdi: c.besoeg }; }))
      : '<div class="lgodt" style="border-left-color:var(--linje)">Ingen besøg fra ' +

      ? '<div class="nul">Ikke én eneste sidevisning i perioden — hverken udefra ' +
        "eller via et klik herinde. Det er som regel den mest brugbare oplysning " +
        "på skærmen: enten skal siderne være lettere at finde, eller også skal de væk." +
        '<div class="nul-liste">' + ingen.map(function (p) {
          return "<code>" + esc(p) + "</code>";
        }).join("") + "</div></div>"

  var LAESERRUDER = {
    laes: laeserOverblikHtml,
    laesnyt: laeserNyhederHtml,
    laestraf: laeserTrafikHtml
  };

  // Læselige navne på de værter, folk kommer fra. Cloudflare siger
  // "l.facebook.com"; det er samme sted som "m.facebook.com", og delt op
  // ligner hver af dem ingenting.
  var HENVISERNAVNE = [
    ["facebook.com", "Facebook"], ["fb.com", "Facebook"],
    ["linkedin.com", "LinkedIn"], ["lnkd.in", "LinkedIn"],
    ["google.", "Google"], ["bing.com", "Bing"],
    ["duckduckgo.com", "DuckDuckGo"], ["t.co", "X/Twitter"],
    ["x.com", "X/Twitter"], ["twitter.com", "X/Twitter"],
    ["bsky.app", "Bluesky"], ["reddit.com", "Reddit"],
    ["instagram.com", "Instagram"], ["buttondown.com", "Nyhedsbrevet"],
    ["news.ycombinator.com", "Hacker News"],
    // AI-chats. Samme liste som AI_CHAT_KILDER i crawler.py - står de her
    // også, får de et læseligt navn i opdelingen pr. artikel.
    ["chatgpt.com", "ChatGPT"], ["chat.openai.com", "ChatGPT"],
    ["perplexity.ai", "Perplexity"], ["claude.ai", "Claude"],
    ["copilot.microsoft.com", "Microsoft Copilot"],
    ["gemini.google.com", "Gemini"], ["chat.deepseek.com", "DeepSeek"],
    ["grok.com", "Grok"], ["you.com", "You.com"], ["poe.com", "Poe"]
  ];

  function henviserNavn(vaert) {
    if (vaert === "direkte" || vaert === "herfra selv") return vaert;
    var v = String(vaert || "").toLowerCase();
    // Længste match først, så "gemini.google.com" ikke bliver til "Google"
    var bedst = null;
    for (var i = 0; i < HENVISERNAVNE.length; i++) {
      var m = HENVISERNAVNE[i][0];
      if (v.indexOf(m) >= 0 && (!bedst || m.length > bedst[0].length)) {
        bedst = HENVISERNAVNE[i];
      }
    }
    return bedst ? bedst[1] : vaert;
  }

  // Læg værter sammen, der er samme sted: l./m./www.facebook.com -> Facebook
  function samlHenvisere(liste) {
    var pr = {}, orden = [];
    (liste || []).forEach(function (h) {
      var n = henviserNavn(h.fra);
      if (!pr[n]) { pr[n] = { navn: n, visninger: 0, besoeg: 0 }; orden.push(n); }
      pr[n].visninger += nul(h.visninger);
      pr[n].besoeg += nul(h.besoeg);
    });
    return orden.map(function (n) { return pr[n]; })
      .sort(function (a, b) { return b.visninger - a.visninger; });
  }

  function aabnArtikel(i) {
    var a = (L.artikler || [])[i];

    var katNavne = (((L || {}).udgivne_temaer || {}).serier || [])
      .map(function (s) { return s.navn; });

      '<button class="luk" id="mLuk">✕</button>' +

        ? '<i style="width:9px;height:9px;border-radius:50%;display:inline-block;' +
          "margin-right:6px;background:" + temafarve(a.kategori, katNavne) + '"></i>' +
          esc(a.kategori) + " · " : "") + esc(a.dato || "") + "</div>" +
      '<div class="kpi" style="margin-bottom:6px">' +
      kpiKort(ltal(a.visninger), "sidevisninger") +
      kpiKort(ltal(a.besoeg), "besøg udefra") + "</div>" +

    krop += '<div class="lgruppe" style="margin-top:18px">Hvor de kom fra</div>';
    krop += kilder.length
      ? '<p class="lmanchet">Målt på sidevisninger. <strong>herfra selv</strong> ' +
        "er klik inde på siden — typisk fra forsiden.</p>" +

        }))
      : (L.hasOwnProperty("sidehenvisere")
          ? '<div class="lgodt" style="border-left-color:var(--linje)">Ingen ' +
            "henvisere registreret for den her artikel i perioden.</div>"
          : venterPaaCrawl("Opdelingen pr. artikel"));

    krop += '<div class="raekke"><a class="k" href="https://ainyheder.com' +
      esc(a.sti) + '" target="_blank" rel="noopener" ' +
      'style="text-decoration:none">Åbn artiklen ↗</a></div>';
    modal.innerHTML = krop;
    bag.classList.add("aaben");
    document.body.style.overflow = "hidden";
    document.getElementById("mLuk").addEventListener("click", luk);
  }

  var side = document.getElementById("side");
  var rude = document.getElementById("rude");
  var valgt = null, laesFane = 0;

  // Fire sektioner i menuen. Alt andet vises som et sekvenstræ inde i ruden.
