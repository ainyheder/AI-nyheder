      { id: "S-crawler", ikon: "⟳", navn: "Crawleren",
        under: Object.keys(S.hjerner).length + " AI-trin i " + ETAPER.length +
              " etaper · kører hver time", etaper: crawler },
      { id: "S-loop", ikon: "◆", navn: "Arbejdsloopet",
        under: "Sådan bliver siden bedre — 4 etaper", etaper: loop },
      { id: "S-kilder", ikon: "◎", navn: "Kilder",
        under: kilderUnder(), egen: kilderHtml },
      { id: "S-historik", ikon: "◷", navn: "Historik",
        under: historikUnder(), egen: historikHtml }
    ];
  }

  /* ---- Kilder: hvor nyhederne kommer fra, og hvad hver enkelt leverer ----
     Læses af crawlerens `data/kilder-data.js`. Redigeres her og gemmes tilbage
     i `opsaetning/feeds.json` med samme fil-vælger som køen bruger.

     `feedsArb` er arbejdskopien. Den starter som det, crawleren SIDST læste i
     feeds.json - ikke som noget, panelet selv bygger af tællingerne. Det er med
     vilje: kommer der et felt i feeds.json, som panelet ikke kender, skal det
     overleve et gem i stedet for at blive slettet af en, der ikke vidste det
     fandtes. */
  var K = window.KILDER_STATUS || null;
  var feedsArb = null, feedsRoert = false;

  function feedsFil() {
    if (!feedsArb) {
      var raa = (K && K.feeds_fil) ? K.feeds_fil : { feeds: [] };
      feedsArb = JSON.parse(JSON.stringify(raa));
      if (!Array.isArray(feedsArb.feeds)) feedsArb.feeds = [];
    }
    return feedsArb;
  }
  function kilderUnder() {
    if (!K) return "Kør et crawl, så tallene kommer";
    var f = feedsFil().feeds;
    var til = f.filter(function (x) { return x.aktiv !== false; }).length;
    return f.length + " kilder · " + til + " slået til" +
           (feedsRoert ? " · ikke gemt endnu" : "");
  }
  function kildeTal(navn) {
    var r = ((K && K.kilder) || []).filter(function (x) { return x.navn === navn; })[0];
    return r || { hentet: 0, i_listen: 0, som_ekstra: 0, status: "ukendt", fejl: "" };
  }
  function kildeMaerke(f, t) {
    if (f.aktiv === false) return ['<span class="km km-fra">slået fra</span>', ""];
    if (t.status === "fejl") return ['<span class="km km-fejl">svarede ikke</span>', t.fejl];
    if (t.status === "ukendt") return ['<span class="km km-ny">ikke hentet endnu</span>',
      "Kilden er tilføjet her, men crawleren har ikke kørt siden. Første kørsel viser, om adressen virker."];
    if (!t.i_listen && !t.som_ekstra) return ['<span class="km km-tom">gav intet</span>',
      "Feedet svarede, men ingen af artiklerne nåede forsiden."];
    return ["", ""];
  }

  /* Fold-ud: hvad kilden faktisk har leveret. Formålet er ikke pynt — det er
     at kunne se, om to sider skriver det samme, og så tage den ene ud. Derfor
     står det tydeligt, når en artikel ligger UNDER en anden histories
     overskrift: så var den en dublet, og en anden kilde vandt. */
  var kilderAabne = {};

  function kildeArtiklerHtml(navn, t) {
    var liste = t.seneste || [];
    if (!liste.length) {
      return '<div class="kilde-tom">Ingen artikler fra ' + esc(navn) +
        " i den nuværende liste. Enten leverer feedet intet, eller også er alt " +
        "faldet ud igen som for gammelt.</div>";
    }
    var dubl = liste.filter(function (r) { return r.hvor === "under"; }).length;
    return '<div class="kilde-artikler"><div class="kilde-artikler-top">' +
      "Seneste " + liste.length + " fra " + esc(navn) +
      (dubl ? " — <b>" + dubl + " af dem lå under en anden kildes overskrift</b>" : "") +
      "</div>" + liste.map(function (r) {
        var maal = r.side ? "../" + r.side : r.link;
        return '<div class="ka' + (r.hvor === "under" ? " ka-dublet" : "") + '">' +
          '<span class="ka-dato">' + esc((r.foerst_set || r.dato || "").slice(0, 10)) + "</span>" +
          (maal ? '<a href="' + escA(maal) + '" target="_blank" rel="noopener">' +
                  esc(r.rubrik || "(uden overskrift)") + "</a>"
                : esc(r.rubrik || "(uden overskrift)")) +
          (r.hvor === "under"
            ? '<span class="ka-under">lå under «' + esc(r.under) + "»</span>" : "") +
          "</div>";
      }).join("") + "</div>";
  }

  function kilderHtml() {
    if (!K) {
      return '<div class="tom-besked"><b>Ingen tal endnu.</b><br><br>' +
        "<code>data/kilder-data.js</code> skrives af crawleren ved hver kørsel. " +
        "Kør et crawl, eller hent det seneste ned fra GitHub, så står listen her." +
        "</div>";
    }
    var f = feedsFil().feeds;
    var raekker = f.map(function (x, i) {
      var t = kildeTal(x.navn), m = kildeMaerke(x, t);
      var noter = [];
      if (x.kategori) noter.push(esc(x.kategori));
      if (x.kun_aktuel) noter.push("arkivforbud");
      if (x.max) noter.push("højst " + x.max);
      var aaben = kilderAabne[x.navn];
      var over = (t.overlap || []).filter(function (o) { return o[0] !== x.navn; });
      return '<tr class="kilde-r' + (x.aktiv === false ? " fra" : "") + '">' +
        '<td><div class="kilde-navn">' +
        '<button class="fold" data-kilde-fold="' + escA(x.navn) + '" aria-expanded="' +
        (aaben ? "true" : "false") + '">' + (aaben ? "▾" : "▸") + "</button> " +
        esc(x.navn) + " " + m[0] + "</div>" +
        '<div class="kilde-url">' + esc(x.url) + "</div>" +
        (noter.length ? '<div class="kilde-noter">' + noter.join(" · ") + "</div>" : "") +
        (over.length ? '<div class="kilde-overlap">Skrev det samme som ' +
          over.map(function (o) { return esc(o[0]) + " " + o[1] + "×"; }).join(", ") +
          "</div>" : "") +
        (m[1] ? '<div class="kilde-fejl">' + esc(m[1]) + "</div>" : "") + "</td>" +
        '<td class="tal">' + t.hentet + "</td>" +
        '<td class="tal"><b>' + t.i_listen + "</b></td>" +
        '<td class="tal">' + t.som_ekstra + "</td>" +
        '<td class="kilde-knap">' +
        '<button class="k" data-kilde-til="' + i + '">' +
        (x.aktiv === false ? "Slå til" : "Slå fra") + "</button> " +
        '<button class="k" data-kilde-slet="' + i + '">Slet</button></td></tr>' +
        (aaben ? '<tr class="kilde-fold-r"><td colspan="5">' + kildeArtiklerHtml(x.navn, t) +
                 "</td></tr>" : "");
    }).join("");

    var ukendte = ((K && K.kilder) || []).filter(function (r) {
      return r.status === "ikke_i_listen";
    });

    return '<p class="manchet">Hvor nyhederne kommer fra. <b>Hentet</b> er hvad ' +
      "feedet gav ved seneste kørsel, <b>på forsiden</b> hvor mange der endte i " +
      "listen, og <b>som ekstra</b> hvor tit kilden står som ekstra kilde under en " +
      "anden histories overskrift. De tre tal er ikke ens: dubletter, for gamle " +
      "artikler og sammenlægninger tager af puljen undervejs." +
      (K.opdateret ? " Målt " + esc(String(K.opdateret).slice(0, 16).replace("T", " kl. ")) + "." : "") +
      "</p>" +
      '<table class="kilder"><thead><tr><th>Kilde</th><th class="tal">Hentet</th>' +
      '<th class="tal">På forsiden</th><th class="tal">Som ekstra</th><th></th></tr></thead>' +
      "<tbody>" + raekker + "</tbody></table>" +
      (ukendte.length ? '<div class="kilde-advarsel"><b>' + ukendte.length +
        " kilde(r) står i artiklerne, men ikke i listen:</b> " +
        ukendte.map(function (r) { return esc(r.navn); }).join(", ") +
        ". De er sandsynligvis lige slettet — deres artikler forsvinder fra " +
        "forsiden ved næste kørsel, men artikelsiderne bliver liggende.</div>" : "") +
      '<div class="kilde-ny"><h3>Tilføj en kilde</h3>' +
      '<p class="manchet">Adressen skal være et RSS- eller Atom-feed. Panelet kan ' +
      "ikke selv prøve den — browseren blokerer det — så først når crawleren har " +
      "kørt, står der her, om den virkede.</p>" +
      '<div class="kilde-felter">' +
      '<label>Navn<input id="knNavn" placeholder="fx Wired AI" spellcheck="false"></label>' +
      '<label>RSS-adresse<input id="knUrl" placeholder="https://…/feed" spellcheck="false"></label>' +
      '<label>Kategori<input id="knKat" placeholder="Nyheder" spellcheck="false"></label>' +
      '<label>Højst pr. kørsel<input id="knMax" placeholder="valgfrit" inputmode="numeric"></label>' +
      '<label class="afkryds"><input type="checkbox" id="knAktuel"> Arkivforbud ' +
      "(udgiveren tillader ikke, at vi gemmer teksten)</label>" +
      "</div>" +
      '<div class="raekke"><button class="k fyldt" id="knTilfoej">Tilføj kilde</button>' +
      '<span class="kilde-kvit" id="knKvit"></span></div></div>' +
      '<div class="kilde-advarsel kilde-slet-forklar" id="kSletForklar"></div>' +
      '<div class="raekke kilde-gem"><button class="k fyldt" id="kGem"' +
      (feedsRoert ? "" : " disabled") + ">Gem feeds.json</button>" +
      '<span class="kilde-kvit" id="kGemKvit">' +
      (feedsRoert
        ? "Ændringer er ikke gemt endnu"
        : "Intet at gemme endnu") + "</span></div>" +
      '<div class="kilde-advarsel kilde-alder">Listen her er, som <code>feeds.json' +
      "</code> så ud, da crawleren sidst kørte" +
      (K.opdateret ? " — " + esc(String(K.opdateret).slice(0, 16).replace("T", " kl. ")) : "") +
      ". Gemmer du, skrives HELE filen. Har nogen rettet i den siden — i hånden " +
      "eller fra en anden maskine — bliver den rettelse skrevet over. Hent ned " +
      "fra GitHub først, hvis du er i tvivl.</div>";
  }

  function kilderHent() {
    var b = new Blob([JSON.stringify(feedsFil(), null, 2) + "\n"],
                     { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "feeds.json";
    document.body.appendChild(a); a.click(); a.remove();
  }

  async function kilderGem() {
    var kvit = document.getElementById("kGemKvit");
    function sig(t) { if (kvit) kvit.textContent = t; }
    var fil = feedsFil();
    if (!Array.isArray(fil.feeds) || !fil.feeds.length) {
      // Uden den her kan ét klik lægge en tom kildeliste oven i den rigtige,
      // hvis øjebliksbilledet mangler. Så holder siden op med at få nyheder.
      sig("Listen er tom — det gemmer jeg ikke oven i den rigtige fil.");
      return;
    }
    var tekst = JSON.stringify(fil, null, 2) + "\n";
    if (!window.showSaveFilePicker) { kilderHent(); sig("Hentet i stedet ↓ — læg den i opsaetning/"); return; }
    try {
      var h = await window.showSaveFilePicker({
        suggestedName: "feeds.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      var w = await h.createWritable();
      await w.write(tekst);
      await w.close();
      feedsRoert = false;
      sig("Gemt ✓ — push, og ændringen gælder fra næste kørsel");
      tegnSide();
    } catch (fejl) {
      if (fejl && fejl.name === "AbortError") return;
      kilderHent(); sig("Kunne ikke gemme — hentet ↓");
    }
  }

  function kilderBind() {
    var t = document.getElementById("knTilfoej");
    if (t) t.addEventListener("click", function () {
      var navn = (document.getElementById("knNavn").value || "").trim();
      var url = (document.getElementById("knUrl").value || "").trim();
      var kvit = document.getElementById("knKvit");
      if (!navn || !url) { kvit.textContent = "Både navn og adresse skal udfyldes."; return; }
      if (!/^https?:\/\//i.test(url)) { kvit.textContent = "Adressen skal begynde med http:// eller https://"; return; }
      var f = feedsFil().feeds;
      if (f.some(function (x) { return x.navn === navn; })) {
        kvit.textContent = "Der er allerede en kilde, der hedder " + navn + "."; return;
      }
      if (f.some(function (x) { return x.url === url; })) {
        kvit.textContent = "Den adresse står allerede på listen."; return;
      }
      var ny = { navn: navn, url: url };
      var kat = (document.getElementById("knKat").value || "").trim();
      if (kat) ny.kategori = kat;
      var mx = parseInt(document.getElementById("knMax").value, 10);
      if (mx > 0) ny.max = mx;
      if (document.getElementById("knAktuel").checked) ny.kun_aktuel = true;
      f.push(ny); feedsRoert = true; tegn();
    });
    var g = document.getElementById("kGem");
    if (g) g.addEventListener("click", kilderGem);
  }

  function etapeAendret(e) {
    return (e.trin || []).some(erAendret) || (e.dok || []).some(dokErAendret);
  }
  function sektionAendret(s) {
    if (s.enkeltdok) return dokErAendret(s.enkeltdok);
    return (s.etaper || []).some(etapeAendret);
  }

  function tegnSide() {
    side.innerHTML = '<div class="side-gruppe">Kontrolpanel</div>' +
      sektioner().map(function (s) {
        return '<button class="side-punkt' + (s.id === valgt ? " valgt" : "") +
          '" data-etape="' + s.id + '"><span class="nr">' + s.ikon + "</span>" +
          "<span><b>" + esc(s.navn) + "</b><br><small style=\"opacity:.65;font-size:11.5px\">" +
          esc(s.under) + "</small></span>" +
          (sektionAendret(s) ? '<span class="prik" title="ændret"></span>' : "") + "</button>";
      }).join("");
  }

  // Tællingen står med ord, fordi et tal alene ikke siger, om de tre ting i
  // etapen er noget man kan rette eller noget der bare sker.
  function etapeTal(e) {
    // Samme rækkefølge som kortene står i, ellers skal man lede.
    var d = [];
    if ((e.ikke || []).length) d.push(e.ikke.length + " uden AI");
    if ((e.trin || []).length) d.push(e.trin.length + " AI-trin");
    if ((e.dok || []).length) d.push(e.dok.length + (e.dok.length === 1 ? " dokument" : " dokumenter"));
    return d.join(" · ");
  }

  function etapeHtml(e, i) {
    var kasser = (e.ikke || []).map(function (k) {
      return kortHtml({ type: "kk-ikke", ikon: "○", navn: k[0], beskrivelse: k[1],
                        goer: "Sker af sig selv" });
    }).concat((e.trin || []).map(trinHtml)).concat((e.dok || []).map(dokHtml));
    var tal = etapeTal(e);
    return '<div class="etape' + (e.erDok ? " dok-etape" : "") + '">' +
      '<div class="etape-mrk"><div class="etape-navn">' + esc(e.navn) + "</div>" +
      (e.hvornaar ? '<div class="etape-hvornaar">' + esc(e.hvornaar) + "</div>" : "") +
      (tal ? '<div class="etape-tal">' + esc(tal) + "</div>" : "") + "</div>" +
      '<div class="etape-prik">' + (i + 1) + "</div>" +
      '<div class="net">' + kasser.join("") + "</div></div>";
  }

  // Nøglen til farverne. Uden den skal man gætte, hvad en stiplet kant betyder.
  function forklaringHtml(erLoop) {
    var d = erLoop
      ? [["dok", "✎", "Dokument du kan skrive i"],
         ["laes", "▤", "Kun til at læse"],
         ["ikke", "○", "Sker af sig selv"]]
      : [["ai", "◆", "AI-trin · klik for at rette model og instruks"],
         ["ikke", "○", "Ikke AI · sker af sig selv"]];
    return '<div class="forklar"><b>Kortene</b>' + d.map(function (x) {
      return '<i><span class="kk-ikon i-' + x[0] + '">' + x[1] + "</span>" +
             esc(x[2]) + "</i>";
    }).join("") + "</div>";
  }

  function tegnRude() {
    var s = sektioner().filter(function (x) { return x.id === valgt; })[0];
    if (!s) return;
    if (s.enkeltdok) {
      rude.innerHTML = "<h1>" + esc(s.navn) + "</h1>" +
        '<p class="manchet">Skriv det, du vil opnå — sessionen læser listen, før den ' +
        "gør noget andet, og oversætter hvert ønske til en rigtig opgave.</p>" +
        '<div class="net">' + dokHtml(s.enkeltdok) + "</div>";
      return;
    }
    if (s.egen) {
      // Manchetten hørte før kun til Historik og stod som fast tekst her. Med
      // Kilder-ruden ville den have løjet, så hver egen-rude skriver nu sin egen.
      var man = s.id === "S-historik"
        ? '<p class="manchet">Hvad sessionerne har lavet, nyeste først. Én linje pr. ' +
          "post — klik på den for at læse hele posten.</p>"
        : "";
      rude.innerHTML = "<h1>" + esc(s.navn) + "</h1>" + man + s.egen();
      if (s.id === "S-kilder") kilderBind();
      return;
    }
    if (s.etaper[0] && s.etaper[0].laesertal) {
      rude.innerHTML = "<h1>" + esc(s.navn) + "</h1>" +
        '<div class="laesfaner" id="laesfaner">' + s.etaper.map(function (e, i) {
          return '<button class="chip' + (i === laesFane ? " valgt" : "") +
            '" data-fane="' + i + '">' + esc(e.navn) + "</button>"; }).join("") + "</div>" +
        '<div id="laesindhold"></div>';
      var e = s.etaper[laesFane] || s.etaper[0];
      document.getElementById("laesindhold").innerHTML =
        (LAESERRUDER[e.id] || laeserOverblikHtml)();
      document.getElementById("laesfaner").addEventListener("click", function (ev) {
        var c = ev.target.closest("[data-fane]");
        if (c) { laesFane = +c.dataset.fane; tegnRude(); }
      });
      return;
    }
    var erLoop = s.id === "S-loop";
    var hjaelp = erLoop
      ? "Læses oppefra og ned. Dokumenterne er det, sessionen retter sig efter — " +
        "retter du i dem, laver den noget andet."
      : "Rækkefølgen crawleren arbejder i, én gang i timen. Hvert AI-trin er et " +
        "kald, du selv kan bestemme model og instruks for.";
    rude.innerHTML = "<h1>" + esc(s.navn) + "</h1>" +
      '<p class="manchet">' + esc(s.under) + " · " + hjaelp + "</p>" +
      forklaringHtml(erLoop) +
      '<div class="trae' + (erLoop ? " trae-dok" : "") + '">' +
      s.etaper.map(etapeHtml).join("") + "</div>";
  }

  function tegn() {
    if (!valgt) valgt = "S-crawler";
    tegnSide(); tegnRude();
    var n = Object.keys(S.hjerner).filter(erAendret).length +
            Object.keys(dokAendret).filter(dokErAendret).length;
    document.getElementById("bundtekst").textContent = n === 0
      ? "Ingen ændringer endnu"
      : n + " ting er ændret — husk at gemme";
  }
  function tegnNat() { tegn(); }

  side.addEventListener("click", function (ev) {
    var k = ev.target.closest(".side-punkt");
    if (k) { valgt = k.dataset.etape; tegn(); window.scrollTo(0, 0); }
  });
  rude.addEventListener("click", function (ev) {
    var fold = ev.target.closest("[data-kilde-fold]");
    if (fold) {
      var n0 = fold.dataset.kildeFold;
      kilderAabne[n0] = !kilderAabne[n0];
      tegnRude();
      return;
    }
    var til = ev.target.closest("[data-kilde-til]");
    if (til) {
      var f1 = feedsFil().feeds[+til.dataset.kildeTil];
      if (f1) { f1.aktiv = (f1.aktiv === false); if (f1.aktiv) delete f1.aktiv; feedsRoert = true; tegn(); }
      return;
    }
    var slet = ev.target.closest("[data-kilde-slet]");
    if (slet) {
      var i = +slet.dataset.kildeSlet, liste = feedsFil().feeds, f2 = liste[i];
      if (!f2) return;
      // To tryk, ikke ét. En slettet kilde tager sine artikler af forsiden ved
      // næste kørsel, og adressen er væk. Knappen skifter tekst i stedet for at
      // åbne en dialogboks: panelet kører fra file://, og en confirm() dér
      // blokerer alt andet, hvis nogen klikker forkert.
      if (slet.dataset.sikker !== "1") {
        slet.dataset.sikker = "1";
        slet.textContent = "Slet " + f2.navn + "?";
        var t2 = kildeTal(f2.navn);
        var f = document.getElementById("kSletForklar");
        if (f) {
          // Sig hvad der FAKTISK sker. Målt 28.07: crawleren læser feeds.json
          // forfra hver kørsel, så adressen hentes aldrig igen — men `andre`
          // bæres videre i cachen pr. link, og de frosne sider i `artikel/`
          // bliver liggende og står stadig i sitemappet.
          f.innerHTML = "<b>" + esc(f2.navn) + " slettes.</b> Adressen hentes " +
            "aldrig igen, når filen er gemt <i>og pushet</i> — indtil da kører " +
            "sky-crawleren videre på den gamle liste. " +
            (t2.i_listen ? "De <b>" + t2.i_listen + "</b> artikler forsvinder fra " +
              "forsiden ved næste kørsel; deres permanente sider bliver liggende " +
              "og står stadig i sitemappet. " : "") +
            (t2.som_ekstra ? "Kilden står desuden som ekstra kilde under <b>" +
              t2.som_ekstra + "</b> andre historier, og forsiden bliver ved med at " +
              "linke til den dér, indtil de historier selv ruller ud. " : "") +
            "Tryk igen for at slette.";
        }
        setTimeout(function () {
          if (slet.isConnected) {
            slet.dataset.sikker = ""; slet.textContent = "Slet";
            var f3 = document.getElementById("kSletForklar");
            if (f3) f3.innerHTML = "";
          }
        }, 8000);
        return;
      }
      liste.splice(i, 1); feedsRoert = true; tegn();
      return;
    }
    var t = ev.target.closest(".hj");
    if (t) { aabn(t.dataset.n); return; }
    var a = ev.target.closest(".art");
    if (a) { aabnArtikel(Number(a.dataset.art)); return; }
    var h2 = ev.target.closest(".hpost");
    if (h2) { aabnHistorik(Number(h2.dataset.h)); return; }
    var d = ev.target.closest(".dok");
    if (d) aabnDok(d.dataset.dok);
  });

  var bag = document.getElementById("bag"), modal = document.getElementById("modal");
  function luk() {
    bag.classList.remove("aaben"); document.body.style.overflow = "";
    modal.classList.remove("bred");   // næste modal skal starte i normal bredde
  }
  bag.addEventListener("click", function (e) { if (e.target === bag) luk(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") luk(); });

  function aabn(n) {
    var h = S.hjerner[n];
    modal.innerHTML =
      '<button class="luk" id="mLuk">✕</button>' +
      "<h3>" + esc(n.replace(/_/g, " ")) + "</h3>" +
      '<div class="b">' + esc(h.beskrivelse) + "</div>" +
      "<label>Model</label>" +
      '<select id="mModel">' + MODELLER.map(function (m) {
        var valgt = (aendret[n] && aendret[n].model || "") === m[0];
        return '<option value="' + m[0] + '"' + (valgt ? " selected" : "") + ">" + esc(m[1]) + "</option>";
      }).join("") + "</select>" +
      "<label>Instruks til modellen</label>" +
      '<textarea id="mPrompt" spellcheck="false">' + esc(aktivPrompt(n)) + "</textarea>" +
      '<div class="raekke">' +
      '<button class="k fyldt" id="mGem">Gem ændring</button>' +
      '<button class="k" id="mStd">Tilbage til standard</button>' +
      "</div>";
    bag.classList.add("aaben");
    document.body.style.overflow = "hidden";
    document.getElementById("mLuk").addEventListener("click", luk);
    document.getElementById("mStd").addEventListener("click", function () {
      delete aendret[n]; tegn(); luk();
    });
    document.getElementById("mGem").addEventListener("click", function () {
      var mo = document.getElementById("mModel").value.trim();
      var pr = document.getElementById("mPrompt").value;
      var e = {};
      if (mo) e.model = mo;
      if (pr.trim() && pr.trim() !== (S.hjerner[n].standard_prompt || "").trim()) e.prompt = pr;
      if (e.model || e.prompt) aendret[n] = e; else delete aendret[n];
      tegn(); luk();
    });
  }

  // ---- Arbejdsloopet: dokumenter i stedet for prompts ----
  var DOK = {};
  (S.arbejdsloop || []).forEach(function (d) { DOK[d.noegle] = d; });
  var dokAendret = {};        // noegle -> ny tekst, kun i denne session

  var LOOPETAPER = [
    { navn: "Du siger, hvad du vil have", hvornaar: "når som helst",
      ikke: [["Læsertal fra Cloudflare", "Rå tal om hvad folk læser — hentes af crawleren"]],
      dok: ["oensker", "maalestok"] },
    { navn: "Sessionen analyserer og planlægger", hvornaar: "fase 0, hver kørsel",
      dok: ["analyse", "opgavekoe"] },
    { navn: "Sessionen laver det", hvornaar: "efter tidsplan eller Kør nu",
      dok: ["instruks"] },
    { navn: "Du læser regnskabet", hvornaar: "og pusher",
      dok: ["log"] }
  ];

  function dokTekst(k) {
    return dokAendret[k] !== undefined ? dokAendret[k] : (DOK[k] ? DOK[k].indhold : "");
  }
  function dokErAendret(k) {
    return dokAendret[k] !== undefined && DOK[k] && dokAendret[k] !== DOK[k].indhold;
  }

  // ---- Markdown -> HTML, så loggen kan læses i stedet for granskes ----
  // Lille renderer med vilje: panelet åbnes ofte fra file://, hvor vi ikke kan
  // hente et bibliotek. Alt escapes FØR der sættes tags på, så en rubrik fra et
  // fremmed feed i loggen ikke kan finde på noget.
  function mdTekst(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(—])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      // Kun harmløse adresser bliver til links. Loggen citerer rubrikker fra
      // fremmede feeds, og "javascript:" i en markdown-parentes ville ellers
      // blive et klikbart stykke kode.
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (hele, tekst, url) {
        return /^(https?:\/\/|\/|#|mailto:)/i.test(url)
          ? '<a href="' + url + '" rel="noopener">' + tekst + "</a>"
          : hele;
      });
  }

  function mdBlok(md) {
    var l = String(md || "").replace(/\r/g, "").split("\n"), ud = [], i = 0;
    function afsnit(tekst) {
      // "**Fandt:** ..." bliver til et felt med etiket i stedet for fed skrift
      // Begge etiketter skal matche: instruksen skriver nu "Til redaktionen",
      // men hele den gamle log siger "Til Torben", og begge skal fremhæves.
      var m = tekst.match(/^\*\*(Fandt|Gjorde|Testede|Til Torben|Til redaktionen|Fandt ikke):?\*\*\s*([\s\S]*)$/);
      if (m) {
        var klasse = /^Til /.test(m[1]) ? " torben" : "";
        return '<div class="lfelt' + klasse + '"><div class="navn">' + esc(m[1]) +
          '</div><div>' + mdTekst(m[2]) + "</div></div>";
      }
      return "<p>" + mdTekst(tekst) + "</p>";
    }
    while (i < l.length) {
      var r = l[i];
      if (!r.trim()) { i++; continue; }
      if (/^```/.test(r)) {                                   // kodeblok
        var kode = []; i++;
        while (i < l.length && !/^```/.test(l[i])) { kode.push(l[i]); i++; }
        i++;
        ud.push("<pre><code>" + esc(kode.join("\n")) + "</code></pre>");
      } else if (/^\s*\|.*\|\s*$/.test(r)) {                  // tabel
        var raek = [];
        while (i < l.length && /^\s*\|.*\|\s*$/.test(l[i])) { raek.push(l[i]); i++; }
        var celler = raek.map(function (x) {
          return x.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        }).filter(function (c) { return !c.every(function (x) { return /^:?-{2,}:?$/.test(x); }); });
        var t = "<table>";
        celler.forEach(function (c, n) {
          t += "<tr>" + c.map(function (x) {
            return n === 0 ? "<th>" + mdTekst(x) + "</th>" : "<td>" + mdTekst(x) + "</td>";
          }).join("") + "</tr>";
        });
        ud.push(t + "</table>");
      } else if (/^>\s?/.test(r)) {                           // citatblok
        var cit = [];
        while (i < l.length && (/^>\s?/.test(l[i]) || (cit.length && !l[i].trim()))) {
          if (!l[i].trim()) { if (i + 1 < l.length && /^>/.test(l[i + 1])) cit.push(""); else break; }
          else cit.push(l[i].replace(/^>\s?/, ""));
          i++;
        }
        ud.push("<blockquote>" + mdBlok(cit.join("\n")) + "</blockquote>");
      } else if (/^\s*([-*]|\d+\.)\s+/.test(r)) {             // liste
        var nummer = /^\s*\d+\./.test(r), punkter = [], nu = null;
        while (i < l.length && (/^\s*([-*]|\d+\.)\s+/.test(l[i]) || (nu !== null && /^\s{2,}\S/.test(l[i])))) {
          var p = l[i].match(/^\s*(?:[-*]|\d+\.)\s+([\s\S]*)$/);
          if (p) { nu = [p[1]]; punkter.push(nu); }
          else if (nu) nu.push(l[i].trim());
          i++;
        }
        ud.push((nummer ? "<ol>" : "<ul>") + punkter.map(function (p) {
          return "<li>" + mdTekst(p.join(" ")) + "</li>";
        }).join("") + (nummer ? "</ol>" : "</ul>"));
      } else if (/^#{1,6}\s+/.test(r)) {                      // overskrift inde i et kort
        ud.push("<h4>" + mdTekst(r.replace(/^#{1,6}\s+/, "")) + "</h4>"); i++;
      } else if (/^(-{3,}|\*{3,})\s*$/.test(r)) {
        ud.push("<hr>"); i++;
      } else {                                                // almindeligt afsnit
        var buf = [];
        while (i < l.length && l[i].trim() && !/^(#{1,6}\s|>|```|\s*\||-{3,}\s*$)/.test(l[i])
               && !/^\s*([-*]|\d+\.)\s+/.test(l[i])) { buf.push(l[i].trim()); i++; }
        if (!buf.length) { i++; continue; }
        ud.push(afsnit(buf.join(" ")));
      }
    }
    return ud.join("");
  }

  // Deler loggen op, så hver nat bliver sit eget kort
  function logHtml(md) {
    var tekst = String(md || "").replace(/\r/g, "");
    var l = tekst.split("\n"), intro = [], dele = [], nu = null;
    l.forEach(function (r) {
      var h = r.match(/^(#{2,3})\s+(.*\S)\s*$/);
      if (h) { nu = { niveau: h[1].length, titel: h[2], krop: [] }; dele.push(nu); return; }
      if (/^#\s+/.test(r)) return;                       // filens egen H1
      (nu ? nu.krop : intro).push(r);
    });
    // introen: alt før første nat. Skillelinjer væk, resten som den er.
    var ud = "";
    var itxt = intro.join("\n").replace(/^\s*-{3,}\s*$/gm, "").trim();
    if (itxt) ud += '<div class="intro">' + mdBlok(itxt) + "</div>";
    if (!dele.length) return ud || mdBlok(tekst);
    var MDR = ["januar", "februar", "marts", "april", "maj", "juni",
               "juli", "august", "september", "oktober", "november", "december"];
    dele.forEach(function (d) {
      // Overskrifterne står som "2026-07-26 · Titel", men regnskabet vender om:
      // "Nattens regnskab · 2026-07-26". Find datoen, hvor den end står, og lad
      // resten være titlen - så også "(første kørsel)" bliver hængende rigtigt.
      var dm = d.titel.match(/(\d{4})-(\d{2})-(\d{2})/);
      var dato = "", titel = d.titel;
      if (dm) {
        dato = parseInt(dm[3], 10) + ". " + MDR[parseInt(dm[2], 10) - 1] + " " + dm[1];
        titel = d.titel.replace(dm[0], "").replace(/\s*·\s*/g, " ")
                       .replace(/\s{2,}/g, " ").trim() || "Natten";
      }
      var regnskab = /regnskab/i.test(d.titel);
      var krop = d.krop.join("\n").replace(/^\s*-{3,}\s*$/gm, "").trim();
      ud += '<article class="lkort' + (regnskab ? " regnskab" : "") + '">' +
        (dato ? '<div class="dato">' + esc(dato) + "</div>" : "") +
        '<div class="titel">' + mdTekst(titel) + "</div>" +
        mdBlok(krop) + "</article>";
    });
    return ud;
  }

  // ---- Historikken: loggen skimmet i stedet for læst ----
  // Arbejdsloggen er over 200 KB og skrevet til at blive læst grundigt. Vil man
  // bare vide, hvad der er sket på det seneste, er den forkert form: man skal
  // igennem hele posten for at finde ud af, om den overhovedet angår én.
  // Her står kun dato, rubrik og én linje om, hvad der blev gjort. Klik åbner
  // hele posten - de samme data, bare ikke alle på én gang.
  var MDR_HIST = ["januar", "februar", "marts", "april", "maj", "juni",
                  "juli", "august", "september", "oktober", "november", "december"];
  var historikCache = null;

  // Trækker ét felt ud af en log-post ("**Gjorde:** ..."). Feltet slutter ved en
  // tom linje eller ved næste felt - IKKE ved næste linje, for de fleste af dem
  // er ombrudt over flere, og så ville resuméet stoppe midt i en sætning.
  function logFelt(krop, navne) {
    var l = krop.split("\n");
    for (var i = 0; i < l.length; i++) {
      var m = l[i].match(/^\*\*([^*:]+):?\*\*\s*(.*)$/);
      if (!m || navne.indexOf(m[1].trim()) < 0) continue;
      var buf = [m[2]];
      for (var j = i + 1; j < l.length && l[j].trim() && !/^\*\*/.test(l[j]); j++) {
        buf.push(l[j].trim());
      }
      return buf.join(" ").replace(/[*`]/g, "").replace(/\s+/g, " ").trim();
    }
    return "";
  }

  function historikPoster() {
    if (historikCache) return historikCache;
    var raa = [], nu = null;
    String(dokTekst("log") || "").replace(/\r/g, "").split("\n").forEach(function (r) {
      var h = r.match(/^(#{2,3})\s+(.*\S)\s*$/);
      if (h) { nu = { titel: h[2], krop: [] }; raa.push(nu); return; }
      if (/^#\s+/.test(r)) return;                       // filens egen H1
      if (nu) nu.krop.push(r);
    });
    historikCache = raa.map(function (p) {
      // Datoen står forrest i en almindelig post og bagest i et regnskab.
      // Find den, hvor den end står, og lad resten være rubrikken.
      var titel = p.titel, iso = "", dato = "", tid = "";
      var dm = titel.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (dm) {
        iso = dm[0];
        dato = parseInt(dm[3], 10) + ". " + MDR_HIST[parseInt(dm[2], 10) - 1] + " " + dm[1];
        titel = titel.replace(dm[0], "");
      }
      // "(kl. 07:2x, chat)" og "(ekstra kørsel kl. 21:15)" hører til linjens
      // margen, ikke til rubrikken - de fylder ellers halvdelen af den.
      // MEN kun dem, der faktisk siger noget om kørslen: en efterprøvning
      // hedder «Kørekortet er gemt bag nyhederne» (25.07), og dén parentes er
      // punktets egen dato. Flyttes den ud, ligner den et klokkeslæt.
      var tm = titel.match(/\(([^)]*)\)/);
      if (tm && /kl\.|kørsel|kørslen|chat|formiddag|eftermiddag/i.test(tm[1])) {
        tid = tm[1].replace(/,\s*chat\s*$/, "").trim();
        titel = titel.replace(tm[0], "");
      }
      titel = titel.replace(/\s*·\s*/g, " ").replace(/\s{2,}/g, " ").trim();
      var krop = p.krop.join("\n").replace(/^\s*-{3,}\s*$/gm, "").trim();
      // "Gjorde" først: det er dét, spørgsmålet "hvad er der ændret?" handler
      // om. "Fandt" er begrundelsen og kommer kun frem, når der ikke blev
      // ændret noget - fx i en efterprøvning.
      return { iso: iso, dato: dato, tid: tid, krop: krop,
               titel: titel || "Uden rubrik",
               regnskab: /regnskab/i.test(p.titel),
               sprang: /^sprang over/i.test(titel),
               resume: logFelt(krop, ["Gjorde"]) ||
                       logFelt(krop, ["Fandt", "Fandt ikke"]) ||
                       krop.split(/\n\s*\n/)[0].replace(/[*`#>]/g, "")
                           .replace(/\s+/g, " ").trim() };
    });
    return historikCache;
  }

  // Til menupunktet i siden. Regnskaber og oversprungne kørsler tælles ikke
  // med: de er ikke ændringer, og tallet skal kunne læses som "så meget er der
  // sket med siden".
  function historikUnder() {
    var p = historikPoster();
    if (!p.length) return "Ingen poster endnu";
    var n = p.filter(function (x) { return !x.regnskab && !x.sprang; }).length;
    var f = p.filter(function (x) { return x.dato; })[0];
    return n + (n === 1 ? " ændring" : " ændringer") + (f ? " · seneste " + f.dato : "");
  }

  function historikHtml() {
    var p = historikPoster();
    if (!p.length) {
      return '<div class="ktom">Der står ikke noget i arbejdsloggen endnu. ' +
             "Den fyldes af sessionerne, efterhånden som de laver noget.</div>";
    }
    // Grupperes på dato og ikke på "skiftede datoen?": samme dag kan stå to
    // steder i filen med et regnskab imellem, og så ville dagen få to
    // overskrifter med samme tal i.
    var raek = [], hvor = {};
    p.forEach(function (x, i) {
      var n = x.iso || "ukendt";
      if (hvor[n] === undefined) { hvor[n] = raek.length; raek.push({ dato: x.dato, poster: [] }); }
      raek[hvor[n]].poster.push({ x: x, i: i });
    });
    return raek.map(function (g) {
      var antal = g.poster.filter(function (o) { return !o.x.regnskab; }).length;
      return '<div class="kgruppe">' + esc(g.dato || "Uden dato") +
        (antal ? " — " + antal + (antal === 1 ? " post" : " poster") : "") + "</div>" +
        g.poster.map(function (o) {
          var x = o.x;
          return '<button class="kpunkt hpost' + (x.regnskab ? " regnskab" : "") +
            (x.sprang ? " sprang" : "") + '" data-h="' + o.i + '">' +
            '<span class="knr">' + (x.regnskab ? "∑" : x.sprang ? "–" : "✓") + "</span>" +
            '<span class="ktekst"><span class="ktitel">' + mdTekst(x.titel) + "</span>" +
            (x.resume ? '<span class="kdetalje">' + esc(x.resume.slice(0, 190)) +
                        (x.resume.length > 190 ? "…" : "") + "</span>" : "") + "</span>" +
            (x.tid ? '<span class="htid">' + esc(x.tid) + "</span>" : "") + "</button>";
        }).join("");
    }).join("") +
      '<div class="hslut">Kun de nyeste poster står her — panelet får et klippet ' +
      "øjebliksbillede, ikke hele filen. Hele historikken ligger i " +
      "<code>_redaktion/arbejdslog.md</code>.</div>";
  }

  function aabnHistorik(i) {
    var x = historikPoster()[i];
    if (!x) return;
    modal.innerHTML =
      '<button class="luk" id="mLuk">✕</button>' +
      "<h3>" + mdTekst(x.titel) + "</h3>" +
      '<div class="b">' + esc([x.dato, x.tid].filter(Boolean).join(" · ")) +
      " · <code>_redaktion/arbejdslog.md</code></div>" +
      '<div class="laesevis">' + mdBlok(x.krop) + "</div>";
    modal.classList.remove("bred");   // én post læses bedst i én spalte
    bag.classList.add("aaben");
    document.body.style.overflow = "hidden";
    document.getElementById("mLuk").addEventListener("click", luk);
  }

  function dokHtml(k) {
    var d = DOK[k];
    if (!d) return "";
    var a = dokErAendret(k), skriv = !!d.kan_rettes;
    return kortHtml({
      type: skriv ? "kk-dok" : "kk-laes", ikon: skriv ? "✎" : "▤", klik: true,
      ekstra: " dok" + (skriv ? "" : " laes"), data: ' data-dok="' + k + '"',
      navn: d.navn,
      maerker: (a ? '<span class="flag">ÆNDRET</span>' : "") +
        (d.findes ? "" : '<span class="flag" style="color:var(--rav)">FINDES IKKE ENDNU</span>'),
      beskrivelse: d.beskrivelse,
      mrk: '<span class="f">' + esc(d.fil) + "</span>",
      goer: skriv ? "Klik for at skrive" : "Kun læsning"
    });
  }

  // ---- Køen som liste: parse, vis, byg om ----
  // Filen har tre dele: alt før "## Kø", selve køen, og alt fra næste "## ".
  // Vi rører kun den midterste, så Mistanker, Fast gennemgang, Klaret og alt
  // andet under egen ##-overskrift overlever, uanset hvad der flyttes rundt.
  // Halen findes ved at lede efter den NÆSTE ##-overskrift og ikke ved navn:
  // ellers ville en ny sektion mellem køen og "Klaret" blive slugt ved gem,
  // fordi punkt-parseren nedenfor kun kender ###/#### og kasserer resten.
  function parseKoe(tekst) {
    // Skal forankres til linjestart: forordet nævner "## Kø" inde i en tabel,
    // og et almindeligt indexOf ville finde dén og gøre køen tom.
    var h = /^## Kø[^\S\n]*$/m.exec(tekst);
    if (!h) return null;
    var start = h.index + h[0].length;
    var m = /\n## /.exec(tekst.slice(start));
    var iSlut = m ? start + m.index + 1 : -1;
    if (iSlut < 0) return null;
    var hoved = tekst.slice(0, start);
    var hale = tekst.slice(iSlut);
    var krop = tekst.slice(start, iSlut);
    var blokke = [], nu = null;
    krop.split("\n").forEach(function (l) {
      var h = l.match(/^#{3,4}\s+(.*\S)\s*$/);
      var p = l.match(/^- \[( |x)\] ?(.*)$/);
      if (h) { nu = null; blokke.push({ type: "gruppe", tekst: h[1] }); }
      else if (p) { nu = { type: "punkt", faerdig: p[1] === "x", linjer: [p[2]] }; blokke.push(nu); }
      else if (nu && l.trim()) { nu.linjer.push(l.trim()); }
      else { nu = null; }
    });
    return { hoved: hoved, hale: hale, blokke: blokke };
  }

  function byggKoe(k) {
    var ud = [k.hoved, ""];
    k.blokke.forEach(function (b) {
      if (b.type === "gruppe") { ud.push("", "### " + b.tekst, ""); return; }
      ud.push("- [" + (b.faerdig ? "x" : " ") + "] " + b.linjer[0]);
      b.linjer.slice(1).forEach(function (l) { ud.push("      " + l); });
      ud.push("");
    });
    ud.push("---", "");
    return ud.join("\n").replace(/\n{4,}/g, "\n\n\n") + k.hale;
  }

  function titelAf(p) {
    var m = p.linjer[0].match(/^\*\*(.+?)\*\*/);
    return m ? m[1] : p.linjer[0].replace(/\*\*/g, "");
  }
  function restAf(p) {
    var f = p.linjer[0].replace(/^\*\*.+?\*\*/, "").trim();
    return [f].concat(p.linjer.slice(1)).join(" ")
      .replace(/\*\*/g, "").replace(/\*/g, "").replace(/\s+/g, " ").trim();
  }

  var koeData = null;

  // Sektioner uden for selve køen. De prioriteres ikke og kan ikke flyttes,
  // men "Venter på redaktionen" er spørgsmål stillet TIL dig — de skal ses,
  // ellers står loopet stille, uden at nogen opdager hvorfor.
  function haleSektion(navn) {
    if (!koeData) return [];
    var h = new RegExp("^## " + navn + "[^\\S\\n]*$", "m").exec(koeData.hale);
    if (!h) return [];
    var fra = koeData.hale.slice(h.index + h[0].length);
    var slut = /\n## /.exec(fra);
    var krop = slut ? fra.slice(0, slut.index) : fra;
    return krop.split(/\n(?=- )/).slice(1).map(function (p) {
      var l = p.trim().replace(/^- /, "").split("\n");
      var m = l[0].match(/^\*\*(.+?)\*\*/);
      return { titel: m ? m[1] : l[0].replace(/\*\*/g, ""),
               rest: l.slice(1).join(" ").replace(/[*`]/g, "").replace(/\s+/g, " ").trim() };
    });
  }

  function venterHtml() {
    var v = haleSektion("Venter på redaktionen");
    if (!v.length) return "";
    return '<div class="kgruppe">Venter på jer — ' + v.length +
      " spørgsmål, der holder arbejdet tilbage</div>" +
      v.map(function (p) {
        return '<div class="kpunkt venter"><span class="knr">?</span>' +
          '<div class="ktekst"><div class="ktitel">' + esc(p.titel) + "</div>" +
          (p.rest ? '<div class="kdetalje">' + esc(p.rest.slice(0, 260)) +
                    (p.rest.length > 260 ? "…" : "") + "</div>" : "") +
          "</div></div>";
      }).join("");
  }

  function tegnKoeliste() {
    var vaert = document.getElementById("kliste");
    if (!vaert || !koeData) return;
    var nr = 0;
    var aabne = koeData.blokke.filter(function (b) { return b.type === "punkt" && !b.faerdig; });
    if (!aabne.length) {
      vaert.innerHTML = '<div class="ktom">Køen er tom — det er et godt tegn. ' +
        "Næste kørsel tager en fast gennemgang i stedet.</div>" + venterHtml();
      return;
    }
    vaert.innerHTML = koeData.blokke.map(function (b, i) {
      if (b.type === "gruppe") return '<div class="kgruppe">' + esc(b.tekst) + "</div>";
      if (b.faerdig) return "";
      nr++;
      var rest = restAf(b);
      // Fravælg sker i to trin: krydset åbner en grund-linje her i punktet.
      // Uden grund ville "Fravalgt" blot være en skraldespand, og listen skal
      // kunne læses af næste kørsel som en begrundelse for ikke at foreslå det igen.
      if (b.fravaelger) {
        return '<div class="kpunkt fravaelg"><span class="knr">✕</span>' +
          '<div class="ktekst"><div class="ktitel">' + esc(titelAf(b)) + "</div>" +
          '<div class="kdetalje">Hvorfor skal det ikke laves? Grunden kommer med ned i ' +
          "<code>## Fravalgt</code>, så ingen kørsel foreslår det samme igen.</div>" +
          '<input class="kgrund" id="kgrund" data-i="' + i + '" maxlength="240" ' +
          'placeholder="fx: koster penge, og læseren mærker det ikke">' +
          "</div>" +
          '<div class="kknapper">' +
          '<button class="nej" data-flyt="fravalg-ok" data-i="' + i + '" title="Fravælg punktet">✓</button>' +
          '<button data-flyt="fravalg-fortryd" data-i="' + i + '" title="Fortryd">↩</button>' +
          "</div></div>";
      }
      return '<div class="kpunkt' + (nr === 1 ? " top" : "") + '">' +
        '<span class="knr">' + nr + "</span>" +
        '<div class="ktekst"><div class="ktitel">' + esc(titelAf(b)) + "</div>" +
        (rest ? '<div class="kdetalje">' + esc(rest) + "</div>" : "") + "</div>" +
        '<div class="kknapper">' +
        '<button data-flyt="op" data-i="' + i + '" title="Op">↑</button>' +
        '<button data-flyt="ned" data-i="' + i + '" title="Ned">↓</button>' +
        '<button class="ok" data-flyt="klaret" data-i="' + i + '" title="Markér som klaret — punktet flytter til Klaret">✓</button>' +
        '<button class="nej" data-flyt="fravalg" data-i="' + i + '" title="Fravælg — det her skal ikke laves">✕</button>' +
        "</div></div>";
    }).join("") + venterHtml();
  }

  function koeKlik(ev) {
    var b = ev.target.closest("[data-flyt]");
    if (!b || !koeData) return;
    var i = +b.dataset.i, blokke = koeData.blokke;
    var handling = b.dataset.flyt;
    if (handling === "fravalg") {
      blokke.forEach(function (x) { delete x.fravaelger; });
      blokke[i].fravaelger = true;
      tegnKoeliste();
      var felt = document.getElementById("kgrund");
      if (felt) felt.focus();
      return;                       // intet er ændret i filen endnu
    }
    if (handling === "fravalg-fortryd") {
      delete blokke[i].fravaelger;
      tegnKoeliste();
      return;
    }
    if (handling === "fravalg-ok") {
      var f = document.getElementById("kgrund");
      var grund = f ? f.value.trim() : "";
      if (!grund) {                 // en tom grund er værre end intet
        if (f) { f.classList.add("mangler"); f.focus(); }
        return;
      }
      var fp = blokke.splice(i, 1)[0];
      delete fp.fravaelger;
      tilFravalgt(titelAf(fp), grund);
      gemKoe();
      return;
    }
    if (handling === "klaret") {
      var p = blokke.splice(i, 1)[0];
      p.faerdig = true;
      p.linjer[0] += " *(klaret " + new Date().toISOString().slice(0, 10) + ")*";
      // m-flaget er nødvendigt: halen begynder ved "## Mistanker", ikke ved
      // "## Klaret", så et uforankret ^ ville ramme forbi og tabe punktet.
      koeData.hale = koeData.hale.replace(/^## Klaret[^\S\n]*\n/m,
        "## Klaret\n\n- [x] " + p.linjer[0] + "\n");
    } else {
      var ret = b.dataset.flyt === "op" ? -1 : 1, j = i + ret;
      while (j >= 0 && j < blokke.length && blokke[j].type !== "punkt") j += ret;
      if (j < 0 || j >= blokke.length) return;
      var t = blokke[i]; blokke[i] = blokke[j]; blokke[j] = t;
      // Mærk punktet, så sessionens omsortering i fase 3 lader det stå.
      // Uden det ville næste kørsel sortere beslutningen væk usynligt.
      // Mærket sættes på SIDSTE linje: en rubrik i fed kan gå over to linjer,
      // og så ville et mærke på linje 0 lande midt inde i overskriften.
      if (!t.linjer.some(function (l) { return /#fastholdt/.test(l); }))
        t.linjer[t.linjer.length - 1] += " `#fastholdt`";
    }
    gemKoe();
  }

  // Ét sted, der skriver ændringen tilbage i filen, tegner listen og holder
  // den rå tekstrude i sync. Kaldes fra hver gren i koeKlik.
  function gemKoe() {
    dokAendret.opgavekoe = byggKoe(koeData);
    tegnKoeliste();
    var ta = document.getElementById("dTekst");
    if (ta) ta.value = dokAendret.opgavekoe;
    tegn();
  }

  // Læg et punkt nederst i "## Fravalgt" i filens eget format. Sektionen findes
  // ved næste ##-overskrift og ikke ved navn på den efterfølgende, så en ny
  // sektion imellem ikke sluger listen.
  function tilFravalgt(titel, grund) {
    var dato = new Date().toISOString().slice(0, 10);
    var linje = "- **" + titel + "** — fravalgt " + dato + ": " +
      grund.replace(/\s+/g, " ").replace(/\.*$/, "") + ".\n";
    var h = /^## Fravalgt[^\S\n]*\n/m.exec(koeData.hale);
    if (!h) { koeData.hale += "\n## Fravalgt\n\n" + linje; return; }
    var fra = h.index + h[0].length;
    var n = /\n## /.exec(koeData.hale.slice(fra));
    var slut = n ? fra + n.index + 1 : koeData.hale.length;
    var raa = koeData.hale.slice(fra, slut)
      .replace(/^\*\(Ingen endnu\..*$/m, "");   // pladsholderen ryger ved første rigtige punkt
    var deler = "";
    var d = /\n[-*_]{3,}[^\S\n]*\n\s*$/.exec(raa);
    if (d) { deler = "---\n\n"; raa = raa.slice(0, d.index); }  // stregen bliver stående nederst
    var krop = raa.replace(/\s*$/, "\n\n");
    koeData.hale = koeData.hale.slice(0, fra) + krop + linje + "\n" + deler +
      koeData.hale.slice(slut);
  }

  // ---- Ønsker: formular i stedet for markdown ----
  // Filformatet er med vilje det samme som køens, så sessionen kan læse begge
  // med samme øjne: "- [ ] **Titel** `#mærke`" plus indrykkede linjer.
  var STEDER = ["Forsiden", "Nyhederne", "Læringsdelen", "YouTube",
                "Kontrolpanelet", "Andet"];

  function parseOensker(tekst) {
    var dele = tekst.split("## Behandlet");
    var hoved = dele[0], behandlet = dele[1] || "";
    var i = hoved.indexOf("## Ønsker");
    var top = i < 0 ? hoved : hoved.slice(0, i + "## Ønsker".length);
    var krop = i < 0 ? "" : hoved.slice(i + "## Ønsker".length);
    function laes(t, faerdig) {
      var ud = [], nu = null;
      t.split("\n").forEach(function (l) {
        var m = l.match(/^- \[( |x)\] ?(.*)$/);
        if (m) {
          var r = m[2], titel = (r.match(/^\*\*(.+?)\*\*/) || [0, r])[1];
          var maerker = (r.match(/`#[^`]+`/g) || []).map(function (x) { return x.slice(2, -1); });
          nu = { titel: titel, maerker: maerker, mere: [], faerdig: faerdig || m[1] === "x" };
          ud.push(nu);
        } else if (nu && l.trim() && !l.startsWith("#") && !l.startsWith("*(")) {
          nu.mere.push(l.trim());
        } else if (!l.trim()) { nu = null; }
      });
      return ud;
    }
    return { top: top, aabne: laes(krop, false), behandlet: laes(behandlet, true),
             halehoved: behandlet.split("\n").filter(function (l) {
               return l.startsWith("*("); }).join("\n") };
  }

  function byggOensker(o) {
    var ud = [o.top, ""];
    function skriv(liste, faerdig) {
      liste.forEach(function (x) {
        var m = x.maerker.map(function (t) { return "`#" + t + "`"; }).join(" ");
        ud.push("- [" + (faerdig ? "x" : " ") + "] **" + x.titel + "**" + (m ? " " + m : ""));
        x.mere.forEach(function (l) { ud.push("      " + l); });
        ud.push("");
      });
    }
    skriv(o.aabne, false);
    if (!o.aabne.length) ud.push("*(Ingen ønsker lige nu. Tryk på knappen i panelet for at tilføje et.)*", "");
    ud.push("---", "", "## Behandlet", "");
    ud.push(o.halehoved || "*(Sessionen flytter ønsker herned, når de er lagt i køen eller løst.)*", "");
    skriv(o.behandlet, true);
    return ud.join("\n");
  }

  var oe = null, oeForm = false, oeRedigerer = -1;

  function oeGem() {
    dokAendret.oensker = byggOensker(oe);
    tegn();
  }

  function tegnOensker() {
    var v = document.getElementById("oeliste");
    if (!v || !oe) return;
    var h = "";
    if (oeForm) {
      var r = oeRedigerer >= 0 ? oe.aabne[oeRedigerer] : { titel: "", mere: [], maerker: [] };
      h += '<div class="oe-form"><h4>' + (oeRedigerer >= 0 ? "Ret ønsket" : "Nyt ønske") + "</h4>" +
        '<div class="hj-tekst">Skriv det, du vil opnå. Du behøver ikke vide hvordan — ' +
        "sessionen finder ud af resten og siger til, hvis det er en dårlig idé.</div>" +
        '<label class="oe-mrk">Hvad vil du have?</label>' +
        '<input class="oe-felt" id="oeTitel" placeholder="Fx: Forsiden skal vise hvor lang tid en artikel tager at læse" value="' +
        esc(r.titel) + '">' +
        '<label class="oe-mrk">Fortæl mere <span style="text-transform:none;font-weight:400">(valgfrit)</span></label>' +
        '<textarea class="oe-felt" id="oeMere" placeholder="Hvorfor vil du have det? Hvad irriterer dig i dag? Har du set det gjort et sted?">' +
        esc(r.mere.join(" ")) + "</textarea>" +
        '<label class="oe-mrk">Hvor på siden?</label><div class="chips" id="oeSteder">' +
        STEDER.map(function (s) {
          return '<button class="chip' + (r.maerker.indexOf(s.toLowerCase()) >= 0 ? " valgt" : "") +
            '" data-sted="' + s.toLowerCase() + '">' + s + "</button>";
        }).join("") + "</div>" +
        '<label class="oe-mrk">Hvor vigtigt?</label><div class="chips">' +
        '<button class="chip haster' + (r.maerker.indexOf("haster") >= 0 ? " valgt" : "") +
        '" id="oeHaster">🔥 HASTER — tag det først</button></div>' +
        '<div class="raekke"><button class="k fyldt" id="oeGem">' +
        (oeRedigerer >= 0 ? "Gem ændringen" : "Tilføj ønsket") + "</button>" +
        '<button class="k" id="oeFortryd">Fortryd</button></div></div>';
    } else {
      h += '<div class="oe-top"><button class="oe-ny" id="oeNy"><span>＋</span> Nyt ønske</button>' +
        '<span style="font-size:13.5px;color:var(--svag)">' +
        (oe.aabne.length ? oe.aabne.length + " venter på sessionen" : "Ingen ønsker lige nu") +
        "</span></div>";
    }
    if (!oe.aabne.length && !oeForm) {
      h += '<div class="oe-tom">Du har ingen ønsker på listen.<br><br>' +
        "Skriv det, du gerne vil have lavet — sessionen læser listen, før den gør noget andet.</div>";
    }
    oe.aabne.forEach(function (x, i) {
      var haster = x.maerker.indexOf("haster") >= 0;
      h += '<div class="oe-kort' + (haster ? " haster" : "") + '">' +
        '<div class="oe-krop"><div class="oe-titel">' + esc(x.titel) + "</div>" +
        (x.mere.length ? '<div class="oe-mere">' + esc(x.mere.join(" ")) + "</div>" : "") +
        '<div class="oe-maerker">' +
        (haster ? '<span class="maerke haster">🔥 HASTER</span>' : "") +
        x.maerker.filter(function (m) { return m !== "haster"; }).map(function (m) {
          return '<span class="maerke">' + esc(m) + "</span>"; }).join("") +
        '<span class="maerke">venter på sessionen</span></div></div>' +
        '<div class="oe-knapper">' +
        '<button data-oe="op" data-i="' + i + '" title="Op">↑</button>' +
        '<button data-oe="ret" data-i="' + i + '" title="Ret">✎</button>' +
        '<button data-oe="slet" data-i="' + i + '" title="Slet">✕</button>' +
        "</div></div>";
    });
    if (oe.behandlet.length) {
      h += '<div class="kgruppe">Behandlet · ' + oe.behandlet.length + "</div>";
      oe.behandlet.slice(0, 8).forEach(function (x) {
        h += '<div class="oe-kort faerdig"><div class="oe-krop">' +
          '<div class="oe-titel">' + esc(x.titel) + "</div>" +
          (x.mere.length ? '<div class="oe-mere">' + esc(x.mere.join(" ")) + "</div>" : "") +
          "</div></div>";
      });
    }
    v.innerHTML = h;

    var ny = document.getElementById("oeNy");
    if (ny) ny.addEventListener("click", function () { oeForm = true; oeRedigerer = -1; tegnOensker(); });
    var fortryd = document.getElementById("oeFortryd");
    if (fortryd) fortryd.addEventListener("click", function () { oeForm = false; oeRedigerer = -1; tegnOensker(); });
    var steder = document.getElementById("oeSteder");
    if (steder) steder.addEventListener("click", function (e) {
      var c = e.target.closest(".chip"); if (c) c.classList.toggle("valgt");
    });
    var hast = document.getElementById("oeHaster");
    if (hast) hast.addEventListener("click", function () { this.classList.toggle("valgt"); });
    var gem = document.getElementById("oeGem");
    if (gem) gem.addEventListener("click", function () {
      var titel = document.getElementById("oeTitel").value.trim();
      if (!titel) { document.getElementById("oeTitel").focus(); return; }
      var mere = document.getElementById("oeMere").value.trim();
      var maerker = [].slice.call(document.querySelectorAll("#oeSteder .chip.valgt"))
        .map(function (c) { return c.dataset.sted; });
      if (document.getElementById("oeHaster").classList.contains("valgt")) maerker.unshift("haster");
      var post = { titel: titel, mere: mere ? [mere] : [], maerker: maerker, faerdig: false };
      if (oeRedigerer >= 0) oe.aabne[oeRedigerer] = post;
      else if (maerker.indexOf("haster") >= 0) oe.aabne.unshift(post);
      else oe.aabne.push(post);
      oeForm = false; oeRedigerer = -1; oeGem(); tegnOensker();
    });
    if (!v.dataset.bundet) {
      v.dataset.bundet = "1";
      v.addEventListener("click", function (e) {
        var b = e.target.closest("[data-oe]"); if (!b) return;
        var i = +b.dataset.i;
        if (b.dataset.oe === "slet") { oe.aabne.splice(i, 1); }
        else if (b.dataset.oe === "op" && i > 0) {
          var t = oe.aabne[i]; oe.aabne[i] = oe.aabne[i - 1]; oe.aabne[i - 1] = t;
        } else if (b.dataset.oe === "ret") { oeForm = true; oeRedigerer = i; return tegnOensker(); }
        oeGem(); tegnOensker();
      });
    }
  }

  function aabnDok(k) {
    var d = DOK[k];
    var kan = d.kan_rettes;
    if (k === "oensker") {
      oe = parseOensker(dokTekst(k)); oeForm = false; oeRedigerer = -1;
      modal.innerHTML =
        '<button class="luk" id="mLuk">✕</button>' +
        "<h3>Hvad vil du have lavet?</h3>" +
        '<div class="b">Sessionen læser listen, før den gør noget andet, og oversætter ' +
        "hvert ønske til en rigtig opgave. Er noget en dårlig idé, laver den det ikke — " +
        "men siger hvorfor.</div>" +
        '<div id="oeliste"></div>' +
        '<div class="raekke"><button class="k fyldt" id="dGem">Gem oensker.md</button>' +
        '<button class="k" id="dFortryd">Fortryd alle mine ændringer</button></div>';
      bag.classList.add("aaben");
      document.body.style.overflow = "hidden";
      tegnOensker();
      document.getElementById("mLuk").addEventListener("click", luk);
      document.getElementById("dFortryd").addEventListener("click", function () {
        delete dokAendret.oensker; oe = null; tegn(); luk();
      });
      gemKnap(k, d, function () { return dokTekst(k); });
      return;
    }
    if (k === "opgavekoe") {
      koeData = parseKoe(dokTekst(k));
      if (koeData) {
        modal.innerHTML =
          '<button class="luk" id="mLuk">✕</button>' +
          "<h3>Opgavekøen</h3>" +
          '<div class="b">Rækkefølgen er dét, der bliver lavet. Øverste punkt tages i nat. ' +
          "Flyt med pilene ↑↓, hak af med ✓ når noget er lavet, eller fjern det " +
          "med ✕ — så ryger det ned i <b>Fravalgt</b> med din begrundelse, og " +
          "ingen kørsel foreslår det igen. Husk at gemme filen bagefter.</div>" +
          '<div class="kliste" id="kliste"></div>' +
          '<div class="raekke">' +
          '<button class="k fyldt" id="dGem">Gem opgavekoe.md</button>' +
          '<button class="k" id="dTekstSkift">Rediger som tekst</button>' +
          '<button class="k" id="dFortryd">Fortryd mine ændringer</button></div>' +
          '<div id="tekstrude" hidden><label>Rå fil</label>' +
          '<textarea id="dTekst" spellcheck="false" style="min-height:420px">' +
          esc(dokTekst(k)) + "</textarea></div>";
        // Bred, men ikke i spalter: rækkefølgen ER indholdet i køen, og to
        // spalter ville gøre "flyt op" umulig at følge med øjnene.
        modal.classList.add("bred");
        bag.classList.add("aaben");

        tegnKoeliste();
        document.getElementById("kliste").addEventListener("click", koeKlik);
        document.getElementById("mLuk").addEventListener("click", luk);
        document.getElementById("dTekstSkift").addEventListener("click", function () {
          var r = document.getElementById("tekstrude");
          r.hidden = !r.hidden;
          this.textContent = r.hidden ? "Rediger som tekst" : "Skjul teksten";
        });
        document.getElementById("dFortryd").addEventListener("click", function () {
          delete dokAendret.opgavekoe; koeData = null; tegn(); luk();
        });
        gemKnap(k, d, function () {
          var ta = document.getElementById("dTekst");
          return (ta && !document.getElementById("tekstrude").hidden)
            ? ta.value : dokTekst(k);
        });
        return;
      }
    }
    modal.innerHTML =
      '<button class="luk" id="mLuk">✕</button>' +
      "<h3>" + esc(d.navn) + "</h3>" +
      '<div class="b">' + esc(d.beskrivelse) + " · <code>_redaktion/" + esc(d.fil) + "</code></div>" +
      (kan ? "" : '<div class="advarsel">Den her fil skriver maskinen selv. Du kan læse den, ikke rette den.</div>') +
      (kan
        ? "<label>Indhold</label>" +
          '<textarea id="dTekst" spellcheck="false" style="min-height:420px">' +
          esc(dokTekst(k)) + "</textarea>" +
          '<div class="raekke">' +
          '<button class="k fyldt" id="dGem">Gem ' + esc(d.fil) + "</button>" +
          '<button class="k" id="dHent">Hent fil</button>' +
          '<button class="k" id="dFortryd">Fortryd mine ændringer</button></div>'
        : '<div class="laesevis">' + logHtml(dokTekst(k)) +
          '<div class="lslut">Hele filen står i <code>_redaktion/' + esc(d.fil) + "</code></div></div>");
    modal.classList.toggle("bred", !kan);
    bag.classList.add("aaben");
    document.body.style.overflow = "hidden";
    document.getElementById("mLuk").addEventListener("click", luk);
    if (!kan) return;

    function tekst() { return document.getElementById("dTekst").value; }
    document.getElementById("dHent").addEventListener("click", function () {
      dokAendret[k] = tekst(); tegn(); hentDok(d, tekst());
    });
    document.getElementById("dFortryd").addEventListener("click", function () {
      delete dokAendret[k]; tegn(); luk();
    });
    gemKnap(k, d, tekst);
  }

  function hentDok(d, tekst) {
    var b = new Blob([tekst], { type: "text/markdown" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = d.fil;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Fælles gem-knap for alle dokumenter - både listen og den rå tekst.
  function gemKnap(k, d, tekstFn) {
    var knap = document.getElementById("dGem");
    if (!knap) return;
    knap.addEventListener("click", async function () {
      var t = tekstFn();
      dokAendret[k] = t;
      tegn();
      function kvitter(b) {
        knap.textContent = b;
        setTimeout(function () { knap.textContent = "Gem " + d.fil; }, 2200);
      }
      if (!window.showSaveFilePicker) { hentDok(d, t); kvitter("Hentet i stedet ↓"); return; }
      try {
        var h = await window.showSaveFilePicker({
          suggestedName: d.fil,
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }]
        });
        var w = await h.createWritable();
        await w.write(t);
        await w.close();
        kvitter("Gemt ✓ — push nu");
      } catch (fejl) {
        if (fejl && fejl.name === "AbortError") return;
        hentDok(d, t); kvitter("Kunne ikke gemme — hentet ↓");
      }
    });
  }

  function json() {
    var ud = {};
    Object.keys(aendret).forEach(function (n) { if (erAendret(n)) ud[n] = aendret[n]; });
    return JSON.stringify({
      kommentar: "Overstyrer model og instruks pr. arbejdstrin. Kun det, der står her, er ændret - resten kører på crawlerens indbyggede. Slet et trin for at gå tilbage til standard.",
      hjerner: ud
    }, null, 2);
  }

  function hentFil() {
    var b = new Blob([json()], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "hjerner.json";
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById("hent").addEventListener("click", hentFil);

  // Gem direkte i mappen, hvis browseren tillader det. Første gang skal du
  // pege på _redaktion/hjerner.json; derefter husker knappen filen, så længe
  // fanen er åben, og gemmer oveni med ét klik.
  var filhandle = null;
  document.getElementById("gem").addEventListener("click", async function () {
    var k = this, tekst = json();
    function kvitter(besked) {
      k.textContent = besked;
      setTimeout(function () { k.textContent = "Gem i mappen"; }, 2200);
    }
    if (!window.showSaveFilePicker) {
      hentFil();
      kvitter("Hentet i stedet ↓");
      return;
    }
    try {
      if (!filhandle) {
        filhandle = await window.showSaveFilePicker({
          suggestedName: "hjerner.json",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
        });
      }
      var w = await filhandle.createWritable();
      await w.write(tekst);
      await w.close();
      kvitter("Gemt ✓ — push nu");
    } catch (fejl) {
      if (fejl && fejl.name === "AbortError") return;   // du fortrød
      filhandle = null;
      hentFil();
      kvitter("Kunne ikke gemme — hentet ↓");
    }
  });
  document.getElementById("kopier").addEventListener("click", function () {
    var k = this;
    navigator.clipboard.writeText(json()).then(function () {
      k.textContent = "Kopieret ✓";
      setTimeout(function () { k.textContent = "Kopiér JSON"; }, 1600);
    });
  });
  document.getElementById("nulstilAlt").addEventListener("click", function () {
    if (confirm("Nulstil alle trin til crawlerens indbyggede instrukser?")) { aendret = {}; tegn(); }
  });

  tegn();
})();
</script>
