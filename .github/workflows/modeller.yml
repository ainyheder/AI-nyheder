name: Opdatér modellister
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/modeller.yml'
      - '_redaktion/opdater-modeller.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  modeller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent modellister og opdatér centralen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 _redaktion/opdater-modeller.py
          python3 kommandocentral.py
      - name: Gem modellister
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          git add data/modeller.json data/kommando-data.js
          git diff --staged --quiet || git commit -m "Opdatér tilgængelige AI-modeller"
          git push
