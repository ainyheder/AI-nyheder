# =====================================================================
# Automatisk crawl af AI-nyheder
# ---------------------------------------------------------------------
# Denne workflow kører på GitHubs servere (gratis) og:
#   1. Kører crawler.py hver time hele døgnet
#   2. Committer den nye data/articles.json til main
#   3. GitHub Pages serverer derefter automatisk den nye version
#
# I behøver IKKE gøre noget for at den kører - den passer sig selv.
# I kan også starte den manuelt: fanen "Actions" -> "Crawl AI-nyheder"
# -> "Run workflow".
# =====================================================================

name: Crawl AI-nyheder

on:
  schedule:
    # Hver time hele døgnet, 37 minutter over timen (UTC).
    - cron: "37 * * * *"
  workflow_dispatch:         # gør det muligt at køre den manuelt
    inputs:
      genkoer_alt:
        description: "Genkoer: ja = hele arkivet, soegeord = kun matchende artikler, nej = kun nye"
        default: "nej"
        required: false
  push:
    branches: [main]         # kør også ved push, så siden altid har friske data

permissions:
  contents: write            # workflow'en skal have lov at committe data-filen
  issues: write              # den natlige gennemgang åbner et issue med sine forslag

concurrency:
  group: crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installér Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontrollér redaktionel udvælgelse
        run: |
          python3 _redaktion/proeve-redaktion.py
          python3 _redaktion/proeve-redaktoer-agent.py
          python3 _redaktion/proeve-nyhedskilder.py
          python3 _redaktion/proeve-kommandocentral.py
          python3 _redaktion/proeve-modelkatalog.py

      - name: Kør crawleren (med AI-omskrivning hvis en nøgle findes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          # Sociale opslag. Uden OPSLAG_LIVE=ja skrives der KUN udkast i loggen.
          OPSLAG_LIVE: ${{ vars.OPSLAG_LIVE }}
          BLUESKY_BRUGER: ${{ secrets.BLUESKY_BRUGER }}
          BLUESKY_KODE: ${{ secrets.BLUESKY_KODE }}
          FACEBOOK_SIDE_ID: ${{ secrets.FACEBOOK_SIDE_ID }}
          FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          # Læsertal fra Cloudflare Web Analytics til den natlige gennemgang
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Den natlige gennemgang åbner et issue med sine forslag
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_UDBYDER: ${{ vars.AI_UDBYDER }}
          GENKOER_ALT: ${{ inputs.genkoer_alt || vars.GENKOER_ALT }}
        run: |
          pip install pillow -q
          python3 crawler.py

      - name: Commit de nye artikler
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          git add data feed.xml
          git add uge.html feed-uge.xml 2>/dev/null || true
          # De statiske artikelsider + deres sitemap. UDEN denne linje bliver
          # siderne genereret i hver kørsel og smidt væk igen - så peger både
          # sitemap og alle delelinks på 404.
          git add artikel sitemap-artikler.xml 2>/dev/null || true
          git add video sitemap-videoer.xml 2>/dev/null || true
          # Commit kun hvis der faktisk er ændringer
          git diff --staged --quiet || git commit -m "🤖 Automatisk opdatering af nyheder"
          git push
