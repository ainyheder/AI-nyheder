name: Nyhedsbrev fra nye Metatrends-breve

on:
  schedule:
    # Én daglig kildekontrol kl. 18.13 UTC. GitHub kan forsinke jobs.
    - cron: "13 18 * * *"
  workflow_dispatch:
    inputs:
      test_gmail:
        description: 'Lav seneste brev på ny og send KUN en test til Torbens Gmail'
        type: boolean
        default: false
      check_feed:
        description: 'Kontrollér KUN det levende feed fra GitHub. Ingen AI, billeder eller mails.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # En separat statusgren undgår både ventetid på crawl og konflikter på main.
  group: nyhedsbrev
  cancel-in-progress: false

jobs:
  kontroller-feed:
    if: github.event_name == 'workflow_dispatch' && inputs.check_feed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollér feed-hentningen
        run: python3 _redaktion/proeve-nyhedsbrev-feed.py
      - name: Hent Peters seneste brev direkte fra RSS
        run: python3 nyhedsbrev.py --check
  test-gmail:
    if: github.event_name == 'workflow_dispatch' && inputs.test_gmail && !inputs.check_feed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forbered billedværktøjer
        run: |
          echo "U2NET_HOME=$RUNNER_TEMP/ai-news-models" >> "$GITHUB_ENV"
          pip install -r _redaktion/requirements-billeder.txt -q
      - uses: actions/cache@v4
        with:
          path: ${{ env.U2NET_HOME }}
          key: birefnet-general-newsletter-v1
      - name: Kontrollér testudsendelsen
        run: |
          python3 _redaktion/proeve-nyhedsbrev-feed.py
          python3 _redaktion/proeve-nyhedsbrev.py
          python3 _redaktion/proeve-nyhedsbrev-test.py
      - name: Skriv, kontrollér og send prøve til Gmail
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_UDBYDER: ${{ vars.AI_UDBYDER }}
        run: python3 _redaktion/send-nyhedsbrev-test.py
      - name: Gem prøvebrev og redaktørkontrol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyhedsbrev-gmail-test
          path: newsletter-test-output/
          retention-days: 14
  rediger-og-send:
    if: github.event_name != 'workflow_dispatch' || (!inputs.test_gmail && !inputs.check_feed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forbered billedværktøjer
        working-directory: app
        run: |
          echo "U2NET_HOME=$RUNNER_TEMP/ai-news-models" >> "$GITHUB_ENV"
          pip install -r _redaktion/requirements-billeder.txt -q
      - uses: actions/cache@v4
        with:
          path: ${{ env.U2NET_HOME }}
          key: birefnet-general-newsletter-v1
      - name: Kontrollér kvalitet og beskyttelse mod dobbelt udsendelse
        working-directory: app
        run: |
          python3 _redaktion/proeve-nyhedsbrev-feed.py
          python3 _redaktion/proeve-nyhedsbrev.py
      - name: Hent separat checkout til udsendelseshistorik
        uses: actions/checkout@v4
        with:
          ref: main
          path: newsletter-state
      - name: Åbn varig statusgren
        working-directory: newsletter-state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          # Netværksfejl må ikke forveksles med en manglende gren.
          remote_ref=$(git ls-remote --heads origin refs/heads/codex/nyhedsbrev-status)
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/codex/nyhedsbrev-status
            git checkout -B codex/nyhedsbrev-status FETCH_HEAD
          else
            git switch --orphan codex/nyhedsbrev-status
          fi
      - name: Find nye breve, bearbejd, kontrollér og send
        working-directory: app
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_UDBYDER: ${{ vars.AI_UDBYDER }}
        run: python3 nyhedsbrev.py --run --state-dir ../newsletter-state
      - name: Vis status og vej til fejlretning
        if: always()
        shell: bash
        run: |
          echo '### Nyhedsbrevet' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nye offentlige Metatrends-breve sendes efter redaktion og kvalitetskontrol. Historik og tilbageholdte udkast ligger i state.json på codex/nyhedsbrev-status. Ingen abonnentdata gemmes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ved fejl: læs _redaktion/nyhedsbrev-drift.md. Et uklart afsendelsesforsøg gentages ikke automatisk.' >> "$GITHUB_STEP_SUMMARY"
